# RFC 9207 (OAuth 2.0 Authorization Server Issuer Identification) requirements
# for the core profile. Knowing which authorization server produced an
# authorization response is what makes mix-up attacks detectable, so every
# authorization response carries iss.
#
# Source material: rust-oauth2-server authorization handler and its
# compliance_rfc6749 redirect assertions (see docs/ROADMAP.md, v0.1 core).
- id: RFC9207-2-iss-on-success
  spec: RFC 9207
  clause: "2"
  level: MUST
  profile: core
  summary: A successful authorization response includes an iss parameter whose value is the authorization server's issuer identifier.
  link: https://www.rfc-editor.org/rfc/rfc9207#section-2
- id: RFC9207-2-iss-on-error
  spec: RFC 9207
  clause: "2"
  level: MUST
  profile: core
  summary: An authorization error response delivered by redirect includes the same iss parameter as a success response.
  link: https://www.rfc-editor.org/rfc/rfc9207#section-2
- id: RFC9207-2-iss-exact-match
  spec: RFC 9207
  clause: "2"
  level: MUST
  profile: core
  summary: The iss value is identical, character for character, to the issuer identifier the server publishes in its metadata.
  link: https://www.rfc-editor.org/rfc/rfc9207#section-2
- id: RFC9207-3-iss-no-url-encoding
  spec: RFC 9207
  clause: "3"
  level: MUST
  profile: core
  summary: The iss parameter value is not URL-encoded when appended to the redirect, so the client can compare it byte for byte.
  link: https://www.rfc-editor.org/rfc/rfc9207#section-3
