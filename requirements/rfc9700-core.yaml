# RFC 9700 (OAuth 2.0 Security Best Current Practice) requirements for the core
# profile: code replay, state handling, HTTPS enforcement and the prohibition of
# the implicit and resource-owner-password grants.
#
# Source material: rust-oauth2-server tests/rfc9700_code_replay.rs,
# tests/rfc9700_require_state.rs, tests/rfc9700_https_enforcement.rs
# (see docs/ROADMAP.md, milestone v0.1 core).
- id: RFC9700-2.1.1-code-replay-revokes-tokens
  spec: RFC 9700
  clause: "2.1.1"
  level: MUST
  profile: core
  summary: Replaying an already-exchanged authorization code revokes every access and refresh token issued from the original exchange.
  link: https://www.rfc-editor.org/rfc/rfc9700#section-2.1.1
- id: RFC9700-2.1.1-code-replay-rejected
  spec: RFC 9700
  clause: "2.1.1"
  level: MUST
  profile: core
  summary: A replayed authorization code is rejected with invalid_grant rather than issuing a second token set.
  link: https://www.rfc-editor.org/rfc/rfc9700#section-2.1.1
- id: RFC9700-4.7-require-state-configurable
  spec: RFC 9700
  clause: "4.7"
  level: MAY
  profile: core
  summary: With state enforcement disabled the authorization endpoint accepts requests that carry no state parameter.
  link: https://www.rfc-editor.org/rfc/rfc9700#section-4.7
- id: RFC9700-4.7-require-state-rejects-missing
  spec: RFC 9700
  clause: "4.7"
  level: MUST
  profile: core
  summary: With state enforcement enabled the authorization endpoint rejects requests that omit the state parameter.
  link: https://www.rfc-editor.org/rfc/rfc9700#section-4.7
- id: RFC9700-4.7-require-state-accepts-present
  spec: RFC 9700
  clause: "4.7"
  level: MUST
  profile: core
  summary: With state enforcement enabled the authorization endpoint accepts requests that supply a state parameter.
  link: https://www.rfc-editor.org/rfc/rfc9700#section-4.7
- id: RFC9700-2.6-no-http-redirect-uri
  spec: RFC 9700
  clause: "2.6"
  level: MUST NOT
  profile: core
  summary: The authorization server does not allow redirection URIs using the http scheme, except native-client loopback redirects.
  link: https://www.rfc-editor.org/rfc/rfc9700#section-2.6
  notes: The RFC prohibition is on redirection URIs (authorization responses over unencrypted connections), with the RFC 8252 section 7.3 loopback exception.
- id: RFC9700-2.6-http-upgrade-redirect-308
  spec: RFC 9700
  clause: "2.6"
  level: MAY
  profile: core
  summary: With HTTPS enforcement enabled a plain-HTTP request to the server is redirected permanently (308) to the corresponding HTTPS URL.
  link: https://www.rfc-editor.org/rfc/rfc9700#section-2.6
  notes: Implementation-specific policy. RFC 9700 does not prescribe an inbound HTTP-to-HTTPS redirect or the 308 status; it only forbids http redirection URIs. Renamed from RFC9700-2.6-https-redirect.
- id: RFC9700-2.6-https-enforcement-disableable
  spec: RFC 9700
  clause: "2.6"
  level: MAY
  profile: core
  summary: HTTPS enforcement may be configured off, in which case a plain-HTTP request is served without redirection.
  link: https://www.rfc-editor.org/rfc/rfc9700#section-2.6
  notes: Implementation-specific configuration, not an RFC 9700 requirement; typically used for local development.
- id: RFC9700-4.13-forwarded-proto-trusted
  spec: RFC 9700
  clause: "4.13"
  level: MAY
  profile: core
  summary: TLS terminated by a trusted upstream proxy is accepted via X-Forwarded-Proto without an HTTPS redirect loop.
  link: https://www.rfc-editor.org/rfc/rfc9700#section-4.13
  notes: Implementation-specific proxy policy; RFC 9700 section 4.13 covers reverse-proxy header handling but does not define X-Forwarded-Proto behavior. Renamed from RFC9700-2.6-forwarded-proto-trusted.
- id: RFC9700-4.13-forwarded-proto-untrusted
  spec: RFC 9700
  clause: "4.13"
  level: SHOULD
  profile: core
  summary: An untrusted X-Forwarded-Proto header does not bypass HTTPS enforcement, and the request is still redirected.
  link: https://www.rfc-editor.org/rfc/rfc9700#section-4.13
  notes: Derived from section 4.13, where a reverse proxy MUST sanitize inbound security-relevant headers; the server-side refusal to trust unsanitized headers is an implementation consequence, not a literal RFC server requirement. Renamed from RFC9700-2.6-forwarded-proto-untrusted.
- id: RFC9700-2.1.2-implicit-grant-rejected-policy
  spec: RFC 9700
  clause: "2.1.2"
  level: MAY
  profile: core
  summary: The server rejects authorization requests for the implicit grant (response_type token or id_token token).
  link: https://www.rfc-editor.org/rfc/rfc9700#section-2.1.2
  notes: Local profile policy, not an RFC server requirement. RFC 9700 section 2.1.2 says clients SHOULD NOT use the implicit grant, unless token injection and leakage are mitigated. Rejection is the v0.1 core roadmap behavior; its status as a conformance policy needs owner approval. Renamed from RFC9700-2.1.2-implicit-grant-prohibited.
- id: RFC9700-2.4-ropc-prohibited
  spec: RFC 9700
  clause: "2.4"
  level: MUST NOT
  profile: core
  summary: The resource owner password credentials grant is not supported and its grant_type is rejected as unsupported_grant_type.
  link: https://www.rfc-editor.org/rfc/rfc9700#section-2.4
