# RFC 6750 (Bearer Token Usage) requirements for the token-lifecycle profile.
# Source material: rust-oauth2-server compliance_rfc6750 tests, exercised
# through the userinfo resource (see docs/ROADMAP.md, v0.2).
- id: RFC6750-2.1-bearer-authorization-header
  spec: "RFC 6750"
  clause: "2.1"
  level: MUST
  profile: token-lifecycle
  summary: "A protected resource accepts a valid access token presented in the Authorization header with the Bearer scheme."
  link: https://www.rfc-editor.org/rfc/rfc6750#section-2.1
- id: RFC6750-3-missing-token-challenge
  spec: "RFC 6750"
  clause: "3"
  level: MUST
  profile: token-lifecycle
  summary: "A protected-resource request without credentials is rejected with 401 and a WWW-Authenticate header."
  link: https://www.rfc-editor.org/rfc/rfc6750#section-3
- id: RFC6750-3-challenge-scheme-bearer
  spec: "RFC 6750"
  clause: "3"
  level: MUST
  profile: token-lifecycle
  summary: "The WWW-Authenticate challenge uses the Bearer auth-scheme."
  link: https://www.rfc-editor.org/rfc/rfc6750#section-3
- id: RFC6750-3.1-invalid-token-error-attribute
  spec: "RFC 6750"
  clause: "3.1"
  level: SHOULD
  profile: token-lifecycle
  summary: "A request with an invalid access token is rejected with 401 and a Bearer challenge carrying error=\"invalid_token\"."
  link: https://www.rfc-editor.org/rfc/rfc6750#section-3.1
- id: RFC6750-3.1-invalid-token-body-error
  spec: "RFC 6750"
  clause: "3.1"
  level: MAY
  profile: token-lifecycle
  summary: "The error response body for an invalid token carries error: invalid_token as JSON."
  link: https://www.rfc-editor.org/rfc/rfc6750#section-3.1
  notes: "RFC 6750 defines the error code only for the WWW-Authenticate header; a JSON body echo is implementation behaviour of the reference server."
- id: RFC6750-3-realm-at-most-once
  spec: "RFC 6750"
  clause: "3"
  level: MUST NOT
  profile: token-lifecycle
  summary: "The realm auth-param appears at most once in a Bearer challenge."
  link: https://www.rfc-editor.org/rfc/rfc6750#section-3
