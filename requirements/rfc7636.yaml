- id: RFC7636-4.4.1-missing-challenge
  spec: RFC 7636
  clause: "4.4.1"
  level: MUST
  profile: pkce
  summary: A server that requires PKCE rejects a code exchange for an authorization request that carried no code_challenge.
  link: https://www.rfc-editor.org/rfc/rfc7636#section-4.4.1
- id: RFC7636-4.6-wrong-verifier
  spec: RFC 7636
  clause: "4.6"
  level: MUST
  profile: pkce
  summary: A code exchange whose code_verifier does not match the stored code_challenge is rejected with invalid_grant.
  link: https://www.rfc-editor.org/rfc/rfc7636#section-4.6
