# Persistence requirements for the operations profile: single-use and replay
# guarantees hold across replicas and restarts. Source material: rust-oauth2-server
# storage_contract_sqlx, migrations_postgres, integration (tests/common run_storage_contract).
# Clauses are defined in docs/operations-profile.md; summaries are one line each.

- id: OPS-5.1-code-single-use-across-replicas
  spec: "Operations profile"
  clause: "5.1"
  level: MUST
  profile: operations
  summary: "An authorization code redeemed on one replica is rejected when presented to any other replica."
  link: https://github.com/ianlintner/oauth2-conformance/blob/main/docs/operations-profile.md#5.1-authorization-codes
  notes: "Deployment condition for RFC 6749 section 4.1.2 and RFC 9700 section 2.1.1."
- id: OPS-5.1-code-used-survives-restart
  spec: "Operations profile"
  clause: "5.1"
  level: MUST
  profile: operations
  summary: "An authorization code marked used before a restart is still rejected after the restart."
  link: https://github.com/ianlintner/oauth2-conformance/blob/main/docs/operations-profile.md#5.1-authorization-codes
  notes: "Deployment condition for RFC 6749 section 4.1.2 and RFC 9700 section 2.1.1."
- id: OPS-5.2-refresh-rotation-across-replicas
  spec: "Operations profile"
  clause: "5.2"
  level: SHOULD
  profile: operations
  summary: "A rotated refresh token is rejected by every replica."
  link: https://github.com/ianlintner/oauth2-conformance/blob/main/docs/operations-profile.md#5.2-refresh-tokens
  notes: "Deployment condition for RFC 9700 section 4.14.2."
- id: OPS-5.2-refresh-reuse-revokes-family-across-replicas
  spec: "Operations profile"
  clause: "5.2"
  level: SHOULD
  profile: operations
  summary: "Reuse of a rotated refresh token revokes its whole token family as seen by every replica."
  link: https://github.com/ianlintner/oauth2-conformance/blob/main/docs/operations-profile.md#5.2-refresh-tokens
  notes: "Deployment condition for RFC 9700 section 4.14.2."
- id: OPS-5.3-revocation-across-replicas
  spec: "Operations profile"
  clause: "5.3"
  level: MUST
  profile: operations
  summary: "A revocation performed on one replica takes effect on every replica for access tokens, refresh tokens and introspection results."
  link: https://github.com/ianlintner/oauth2-conformance/blob/main/docs/operations-profile.md#5.3-revocation
  notes: "Deployment condition for RFC 7009 section 2.1 and RFC 7662."
- id: OPS-5.4-dpop-replay-across-replicas
  spec: "Operations profile"
  clause: "5.4"
  level: SHOULD
  profile: operations
  summary: "A DPoP proof consumed on one replica is rejected on every replica."
  link: https://github.com/ianlintner/oauth2-conformance/blob/main/docs/operations-profile.md#5.4-sender-constrained-proofs
  notes: "Deployment condition for RFC 9449 section 11.1; complements RFC9449-11.1-replay-store-cross-instance."
- id: OPS-5.4-dpop-replay-survives-restart
  spec: "Operations profile"
  clause: "5.4"
  level: SHOULD
  profile: operations
  summary: "The DPoP replay cache is not reset by a process restart or instance replacement."
  link: https://github.com/ianlintner/oauth2-conformance/blob/main/docs/operations-profile.md#5.4-sender-constrained-proofs
  notes: "Deployment condition for RFC 9449 section 11.1; complements RFC9449-11.1-replay-store-restart-safe."
- id: OPS-5.5-par-request-uri-single-use-across-replicas
  spec: "Operations profile"
  clause: "5.5"
  level: SHOULD
  profile: operations
  summary: "A pushed authorization request URI is consumed exactly once across replicas."
  link: https://github.com/ianlintner/oauth2-conformance/blob/main/docs/operations-profile.md#5.5-single-use-artifacts
  notes: "Deployment condition for RFC 9126 section 2.2."
- id: OPS-5.5-device-code-single-use-across-replicas
  spec: "Operations profile"
  clause: "5.5"
  level: MAY
  profile: operations
  summary: "A device authorization code is consumed exactly once across replicas."
  link: https://github.com/ianlintner/oauth2-conformance/blob/main/docs/operations-profile.md#5.5-single-use-artifacts
  notes: "Local policy: RFC 8628 does not mandate single use; this fixes the cross-replica behavior the reference storage contract tests."
