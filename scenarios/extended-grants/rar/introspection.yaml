id: extended-grants.rar.introspection
title: "Introspection returns the token authorization_details"
requirements: ["RFC9396-9.2-rar-introspection"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-RAR-INTROSPECTION. Draft: needs an authorization_details-capable SUT and a seeded types policy (part 3/3)."
steps:
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}, "form": {"grant_type": "client_credentials", "authorization_details": "[{\"type\":\"payment_initiation\",\"actions\":[\"initiate\"]}]"}}, "expect": {"status": 200}, "capture": {"at": "body.access_token"}}
  - {"id": "introspect", "request": {"method": "POST", "path": "/oauth/introspect", "headers": {"authorization": "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}, "form": {"token": "{{at}}"}}, "expect": {"status": 200, "json": {"active": true}, "jsonSchema": {"type": "object", "required": ["authorization_details"]}}}
