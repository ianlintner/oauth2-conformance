id: extended-grants.registration.json-post
title: "The registration endpoint accepts a JSON POST"
requirements: ["RFC7591-3-reg-endpoint-json-post", "RFC7591-3-reg-endpoint-tls"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-REG-JSON-POST. Draft: needs SUT registration endpoint enabled in conformance mode (part 3/3). TLS not assertable on loopback."
steps:
  - {"id": "register", "request": {"method": "POST", "path": "/connect/register", "json": {"redirect_uris": ["https://client.example/dyn"], "client_name": "conformance-dyn", "token_endpoint_auth_method": "client_secret_basic", "grant_types": ["authorization_code"]}}, "expect": {"status": 201}, "capture": {"cid": "body.client_id", "rat": "body.registration_access_token"}}
