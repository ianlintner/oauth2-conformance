id: extended-grants.registration.error-format
title: "An invalid registration returns an RFC 7591 error"
requirements: ["RFC7591-3.2.2-reg-error-format"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-REG-ERROR-FORMAT. Draft: needs SUT registration endpoint enabled in conformance mode (part 3/3)."
steps:
  - {"id": "register", "request": {"method": "POST", "path": "/connect/register", "json": {"redirect_uris": ["not a uri"], "client_name": "bad"}}, "expect": {"status": 400, "json": {"error": "invalid_redirect_uri"}}}
