id: extended-grants.registration.response-members
title: "Registration response carries client_id, secret expiry and metadata"
requirements: ["RFC7591-3.2.1-reg-response-client-id", "RFC7591-3.2.1-reg-secret-expires-at", "RFC7591-3.2.1-reg-returns-metadata"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-REG-RESPONSE. Draft: needs SUT registration endpoint enabled in conformance mode (part 3/3)."
steps:
  - {"id": "register", "request": {"method": "POST", "path": "/connect/register", "json": {"redirect_uris": ["https://client.example/dyn"], "client_name": "conformance-dyn", "token_endpoint_auth_method": "client_secret_basic", "grant_types": ["authorization_code"]}}, "expect": {"status": 201, "json": {"client_name": "conformance-dyn"}, "jsonSchema": {"type": "object", "required": ["client_id", "client_secret", "client_secret_expires_at"]}}}
