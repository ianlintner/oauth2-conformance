id: extended-grants.registration.management-uri-and-token
title: "Registration returns a management URI and access token"
requirements: ["RFC7592-3-reg-mgmt-uri-and-token"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-REG-MGMT. Draft: needs SUT registration endpoint enabled in conformance mode (part 3/3)."
steps:
  - {"id": "register", "request": {"method": "POST", "path": "/connect/register", "json": {"redirect_uris": ["https://client.example/dyn"], "client_name": "conformance-dyn", "token_endpoint_auth_method": "client_secret_basic", "grant_types": ["authorization_code"]}}, "expect": {"status": 201, "jsonSchema": {"type": "object", "required": ["registration_access_token", "registration_client_uri"]}}}
