id: extended-grants.par.request-uri-client-bound
title: "A request_uri pushed by one client is rejected when used by another"
requirements: ["RFC9126-2.2-par-request-uri-client-bound"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-PAR-CLIENT-BOUND. Draft: needs a PAR-capable SUT claim of extended-grants (part 3/3). client-enc is the intended counterpart."
steps:
  - {"id": "push", "request": {"method": "POST", "path": "/oauth/par", "headers": {"authorization": "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}, "form": {"client_id": "client-a", "response_type": "code", "redirect_uri": "https://client.example/callback", "scope": "read", "state": "s-par", "code_challenge": "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM", "code_challenge_method": "S256"}}, "expect": {"status": 201, "jsonSchema": {"type": "object", "required": ["request_uri", "expires_in"]}}, "capture": {"ru": "body.request_uri"}}
  - {"id": "use", "request": {"method": "GET", "path": "/oauth/authorize", "query": {"client_id": "client-enc", "request_uri": "{{ru}}"}}, "expect": {"status": 400}}
