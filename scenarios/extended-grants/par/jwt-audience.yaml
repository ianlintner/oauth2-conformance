id: extended-grants.par.jwt-audience
title: "PAR accepts issuer, token or PAR endpoint as client-assertion audience"
requirements: ["RFC9126-2-par-jwt-audience"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-PAR-JWT-AUDIENCE. Draft: needs a PAR-capable SUT claim of extended-grants (part 3/3). Needs runner-side JWT signing for private_key_jwt."
steps:
  - {"id": "push", "request": {"method": "POST", "path": "/oauth/par", "form": {"client_id": "client-a", "response_type": "code", "redirect_uri": "https://client.example/callback", "scope": "read", "state": "s-par", "code_challenge": "E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM", "code_challenge_method": "S256", "client_assertion_type": "urn:ietf:params:oauth:client-assertion-type:jwt-bearer", "client_assertion": "{{assertion_aud_par}}"}}, "expect": {"status": 201}}
