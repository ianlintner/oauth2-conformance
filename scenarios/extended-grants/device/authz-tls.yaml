id: extended-grants.device.authz-tls
title: "Device authorization endpoint is advertised in metadata"
requirements: ["RFC8628-3.1-device-authz-tls"]
profile: extended-grants
status: stable
steps:
  - {"id": "metadata", "request": {"method": "GET", "path": "/.well-known/oauth-authorization-server"}, "expect": {"status": 200, "jsonSchema": {"type": "object", "required": ["device_authorization_endpoint"]}}}
