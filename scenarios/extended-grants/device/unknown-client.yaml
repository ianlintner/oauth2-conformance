id: extended-grants.device.unknown-client
title: "Unknown or missing client_id is rejected"
requirements: ["RFC8628-3.1-unknown-client-rejected"]
profile: extended-grants
status: stable
note: "Invariant INV-EXT-DEVICE-UNKNOWN-CLIENT. Uses only the existing seed."
steps:
  - {"id": "unknown", "request": {"method": "POST", "path": "/oauth/device_authorization", "form": {"client_id": "no-such-client"}}, "expect": {"status": 401, "json": {"error": "invalid_client"}}}
  - {"id": "missing", "request": {"method": "POST", "path": "/oauth/device_authorization", "form": {"scope": "read"}}, "expect": {"status": 400, "json": {"error": "invalid_request"}}}
