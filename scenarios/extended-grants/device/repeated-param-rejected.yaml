id: extended-grants.device.repeated-param-rejected
title: "A repeated device authorization parameter is rejected"
requirements: ["RFC8628-3.1-params-not-repeated"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-DEVICE-PARAMS-NOT-REPEATED. Runner now supports duplicate form keys (ordered { name, value }[]), so this sends a duplicated client_id. Draft, reference-deviation pending Rust fix: the Rust SUT derives Deserialize on DeviceAuthorizationRequest and extracts it via web::Form, so a duplicated key is rejected by serde_urlencoded as a framework deserialization error (400 with a non-OAuth body) rather than the RFC 8628 3.1-required application/json {\"error\":\"invalid_request\"}. The Rust handler must first inspect the raw form for a repeated parameter and answer invalid_request."
steps:
  - {"id": "device", "request": {"method": "POST", "path": "/oauth/device_authorization", "headers": {"authorization": "Basic Y2xpZW50LWRldjp0ZXN0LW9ubHktZGV2LXNlY3JldA=="}, "form": [{"name": "client_id", "value": "client-dev"}, {"name": "scope", "value": "read"}, {"name": "client_id", "value": "client-dev"}]}, "expect": {"status": 400, "json": {"error": "invalid_request"}}}