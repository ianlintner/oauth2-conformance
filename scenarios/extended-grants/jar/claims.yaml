id: extended-grants.jar.claims
title: "A request object carries iss, aud and the authorization parameters"
requirements: ["RFC9101-4-jar-claims"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-JAR-CLAIMS. Draft: needs runner-side JWT signing for request objects and a seeded client JWK (part 3/3)."
steps:
  - {"id": "authorize", "request": {"method": "GET", "path": "/oauth/authorize", "query": {"client_id": "client-a", "request": "{{request_object}}"}}, "expect": {"status": 302}}
