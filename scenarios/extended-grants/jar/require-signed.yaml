id: extended-grants.jar.require-signed
title: "A client requiring signed request objects rejects unsigned ones"
requirements: ["RFC9101-10.5-jar-require-signed"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-JAR-REQUIRE-SIGNED. Draft: needs runner-side JWT signing for request objects and a seeded client JWK (part 3/3)."
steps:
  - {"id": "unsigned", "request": {"method": "GET", "path": "/oauth/authorize", "query": {"client_id": "client-a", "request": "eyJhbGciOiJub25lIn0.e30."}}, "expect": {"status": 400, "json": {"error": "invalid_request_object"}}}
