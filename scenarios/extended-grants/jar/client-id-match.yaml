id: extended-grants.jar.client-id-match
title: "A request object client_id differing from the outer client_id is rejected"
requirements: ["RFC9101-6.3-jar-client-id-match"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-JAR-CLIENT-ID-MATCH. Draft: needs runner-side JWT signing for request objects and a seeded client JWK (part 3/3)."
steps:
  - {"id": "mismatch", "request": {"method": "GET", "path": "/oauth/authorize", "query": {"client_id": "client-enc", "request": "{{request_object}}"}}, "expect": {"status": 400, "json": {"error": "invalid_request"}}}
