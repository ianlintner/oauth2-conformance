id: extended-grants.jar.unsigned-allowed-by-policy
title: "Unsigned request objects are accepted only where policy allows"
requirements: ["RFC9101-4-jar-unsigned-allowed-by-policy"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-JAR-UNSIGNED-POLICY. Draft: needs runner-side JWT signing for request objects and a seeded client JWK (part 3/3)."
steps:
  - {"id": "authorize", "request": {"method": "GET", "path": "/oauth/authorize", "query": {"client_id": "client-a", "request": "{{request_object}}"}}, "expect": {"status": 302}}
