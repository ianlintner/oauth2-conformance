id: extended-grants.exchange.actor-token-type
title: "actor_token_type must not be sent without actor_token"
requirements: ["RFC8693-2.1-tx-actor-token-type"]
profile: extended-grants
status: draft
note: "Invariant INV-EXT-TX-ACTOR-TYPE. Draft: needs a seeded token-exchange client (part 3/3)."
steps:
  - {"id": "subject", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}, "form": {"grant_type": "client_credentials", "scope": "read write"}}, "expect": {"status": 200}, "capture": {"subj": "body.access_token"}}
  - {"id": "actor-type-only", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}, "form": {"grant_type": "urn:ietf:params:oauth:grant-type:token-exchange", "subject_token": "{{subj}}", "subject_token_type": "urn:ietf:params:oauth:token-type:access_token", "actor_token_type": "urn:ietf:params:oauth:token-type:access_token"}}, "expect": {"status": 400, "json": {"error": "invalid_request"}}}
