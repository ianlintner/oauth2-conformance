id: sender-constrained.mtls.tls-client-auth-dn
title: "tls_client_auth with a mismatching Subject DN is rejected"
requirements: ["RFC8705-2.1-tls-client-auth-subject-dn"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-TLS-CLIENT-AUTH-DN. Draft: needs mTLS client-certificate transport in the runner and a seeded client-mtls; needs a certificate whose Subject DN differs from the registered one."
steps:
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "form": {"grant_type": "client_credentials", "client_id": "client-mtls"}}, "expect": {"status": 401, "json": {"error": "invalid_client"}}}
