id: sender-constrained.dpop.iat-stale
title: "A proof with a stale iat is rejected"
requirements: ["RFC9449-4.2-iat-freshness-window"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-IAT-STALE. Draft: needs a DPoP proof signing helper (ES256 key with selectable typ/jwk/htm/htu/iat/jti/ath/nonce claims); needs clock control or a backdated-claim mode."
steps:
