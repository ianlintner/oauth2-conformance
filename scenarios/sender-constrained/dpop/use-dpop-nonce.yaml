id: sender-constrained.dpop.use-dpop-nonce
title: "A proof lacking a required nonce yields use_dpop_nonce"
requirements: ["RFC9449-8-use-dpop-nonce-error"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-USE-DPOP-NONCE. Executable: dpop-nonce-mode helper + dpop-proof; nonce response asserted by capture and $nonempty matcher."
steps:
  - {"id": "nonce-required", "use": "dpop-nonce-mode", "with": {"required": true}, "expect": {"status": 200}}
  - {"id": "proof-no-nonce", "use": "dpop-proof", "with": {"htm": "POST", "htu": "http://localhost:8080/oauth/token"}, "expect": {"status": 200}, "capture": {"proof_token_ok": "body.proof"}}
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_token_ok}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 400, "json": {"error": "use_dpop_nonce"}}, "capture": {"nonce": "header.dpop-nonce"}}
  - {"id": "nonce-off", "use": "dpop-nonce-mode", "with": {"required": false}, "expect": {"status": 200}}
