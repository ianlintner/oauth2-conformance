id: sender-constrained.dpop.signature-verified
title: "A proof whose signature does not verify against its jwk is rejected"
requirements: ["RFC9449-4-proof-signature-verified"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-SIGNATURE-VERIFIED. Draft: needs a DPoP proof signing helper (ES256 key with selectable typ/jwk/htm/htu/iat/jti/ath/nonce claims)."
steps:
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_bad_signature}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 400, "json": {"error": "invalid_dpop_proof"}}}
