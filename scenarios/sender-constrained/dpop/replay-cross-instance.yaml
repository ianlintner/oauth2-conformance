id: sender-constrained.dpop.replay-cross-instance
title: "A proof consumed by one instance is rejected by another"
requirements: ["RFC9449-11.1-replay-store-cross-instance"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-REPLAY-CROSS-INSTANCE. Draft: needs a DPoP proof signing helper (ES256 key with selectable typ/jwk/htm/htu/iat/jti/ath/nonce claims); needs a multi-instance SUT deployment sharing a replay store and a request-on-instance helper (per-step target selection, with.instance) so the first proof goes to instance a and the byte-identical replay to instance b."
steps:
  - {"id": "token", "expect": {"status": 200, "json": {"access_token": "x", "token_type": "DPoP"}}, "use": "request-on-instance", "with": {"instance": "a", "method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_token_ok}}"}, "form": {"grant_type": "client_credentials"}}}
  - {"id": "replay", "expect": {"status": 400, "json": {"error": "invalid_dpop_proof"}}, "use": "request-on-instance", "with": {"instance": "b", "method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_token_ok}}"}, "form": {"grant_type": "client_credentials"}}}
