id: sender-constrained.dpop.jwk-usable-algorithm
title: "A proof using a symmetric alg or a jwk carrying a private key is rejected"
requirements: ["RFC9449-4-jwk-usable-algorithm"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-JWK-USABLE-ALGORITHM. Draft: needs a DPoP proof signing helper (ES256 key with selectable typ/jwk/htm/htu/iat/jti/ath/nonce claims)."
steps:
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_symmetric_alg}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 400, "json": {"error": "invalid_dpop_proof"}}}
