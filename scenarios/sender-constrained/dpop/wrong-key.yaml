id: sender-constrained.dpop.wrong-key
title: "A resource request with a proof from a different key is rejected"
requirements: ["RFC9449-7.2-wrong-key-rejected"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-WRONG-KEY. Draft: needs a DPoP proof signing helper (ES256 key with selectable typ/jwk/htm/htu/iat/jti/ath/nonce claims); needs access-token hash (ath) input to the signing helper; needs a second ephemeral key in the signing helper."
steps:
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_token_ok}}"}, "form": {"grant_type": "client_credentials", "scope": "openid"}}, "expect": {"status": 200, "json": {"access_token": "x", "token_type": "DPoP"}}, "capture": {"at": "body.access_token"}}
  - {"id": "resource", "request": {"method": "GET", "path": "/oauth/userinfo", "headers": {"authorization": "DPoP {{at}}", "dpop": "{{proof_resource_other_key}}"}}, "expect": {"status": 401}}
