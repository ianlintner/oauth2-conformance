id: sender-constrained.dpop.stale-nonce
title: "A nonce outside the accepted window yields use_dpop_nonce"
requirements: ["RFC9449-9-stale-nonce-use-dpop-nonce"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-STALE-NONCE. Draft: needs a DPoP proof signing helper (ES256 key with selectable typ/jwk/htm/htu/iat/jti/ath/nonce claims); needs SUT nonce-required mode; needs clock control or a backdated-claim mode. The DPoP-Nonce response header is asserted by capture (header.dpop-nonce), which fails when the header is absent; the runner has no non-empty header matcher, so a non-empty value is a part 3/3 runner gap."
steps:
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_stale_nonce}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 400, "json": {"error": "use_dpop_nonce"}}, "capture": {"nonce": "header.dpop-nonce"}}
