id: sender-constrained.dpop.forged-nonce
title: "A forged nonce is answered with use_dpop_nonce"
requirements: ["RFC9449-8-forged-nonce-use-dpop-nonce"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-FORGED-NONCE. Draft: needs a DPoP proof signing helper (ES256 key with selectable typ/jwk/htm/htu/iat/jti/ath/nonce claims); needs SUT nonce-required mode."
steps:
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_forged_nonce}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 400, "json": {"error": "use_dpop_nonce"}, "headers": {"dpop-nonce": "$nonempty"}}}
