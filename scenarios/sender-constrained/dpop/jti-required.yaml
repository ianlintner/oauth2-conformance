id: sender-constrained.dpop.jti-required
title: "A proof without a jti claim is rejected"
requirements: ["RFC9449-4.3-jti-required"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-JTI-REQUIRED. Draft: needs a DPoP proof signing helper (ES256 key with selectable typ/jwk/htm/htu/iat/jti/ath/nonce claims)."
steps:
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_no_jti}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 400, "json": {"error": "invalid_dpop_proof"}}}
