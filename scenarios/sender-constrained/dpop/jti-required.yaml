id: sender-constrained.dpop.jti-required
title: "A proof without a jti claim is rejected"
requirements: ["RFC9449-4.3-jti-required"]
profile: sender-constrained
status: stable
note: "Invariant INV-SC-JTI-REQUIRED. Executable with the dpop-proof runner helper (no SUT interface change); Rust reference validated (see docs/sender-constrained-coverage.md). "
steps:
  - {"id": "proof", "use": "dpop-proof", "with": {"htm": "POST", "htu": "http://localhost:8080/oauth/token", "omit": ["jti"]}, "expect": {"status": 200}, "capture": {"proof_value": "body.proof"}}
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_value}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 400, "json": {"error": "invalid_dpop_proof"}}}
