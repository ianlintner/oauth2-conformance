id: sender-constrained.dpop.token-type-dpop
title: "A DPoP-proofed token request yields token_type DPoP"
requirements: ["RFC9449-5-token-type-dpop"]
profile: sender-constrained
status: stable
note: "Invariant INV-SC-TOKEN-TYPE-DPOP. Executable with the dpop-proof runner helper (no SUT interface change); Rust reference validated (see docs/sender-constrained-coverage.md). "
steps:
  - {"id": "proof", "use": "dpop-proof", "with": {"htm": "POST", "htu": "http://localhost:8080/oauth/token"}, "expect": {"status": 200}, "capture": {"proof_value": "body.proof"}}
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_value}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 200, "json": {"access_token": "x", "token_type": "DPoP"}}}
