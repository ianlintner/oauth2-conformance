id: sender-constrained.dpop.token-type-dpop
title: "A DPoP-proofed token request yields token_type DPoP"
requirements: ["RFC9449-5-token-type-dpop"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-TOKEN-TYPE-DPOP. Draft: needs a DPoP proof signing helper (ES256 key with selectable typ/jwk/htm/htu/iat/jti/ath/nonce claims)."
steps:
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_token_ok}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 200, "json": {"access_token": "x", "token_type": "DPoP"}}}
