id: sender-constrained.dpop.typ-header
title: "A proof with typ other than dpop+jwt is rejected"
requirements: ["RFC9449-4-typ-header-dpop-jwt"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-TYP-HEADER. Draft: needs a DPoP proof signing helper (ES256 key with selectable typ/jwk/htm/htu/iat/jti/ath/nonce claims)."
steps:
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_wrong_typ}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 400, "json": {"error": "invalid_dpop_proof"}}}
