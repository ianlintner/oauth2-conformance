id: sender-constrained.dpop.htu-query-ignored
title: "htu is compared without query and fragment; a mismatching htu is rejected"
requirements: ["RFC9449-4.2-htu-query-rejected"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-HTU-QUERY-IGNORED. Draft: needs a DPoP proof signing helper (ES256 key with selectable typ/jwk/htm/htu/iat/jti/ath/nonce claims)."
steps:
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_htu_with_other_path}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 400, "json": {"error": "invalid_dpop_proof"}}}
