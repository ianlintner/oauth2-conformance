id: sender-constrained.dpop.nonce-grace
title: "A nonce from the previous rotation bucket may be accepted"
requirements: ["RFC9449-9-nonce-grace-window"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-NONCE-GRACE. Draft: needs a DPoP proof signing helper (ES256 key with selectable typ/jwk/htm/htu/iat/jti/ath/nonce claims); needs SUT nonce-required mode; needs clock control or a backdated-claim mode."
steps:
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_previous_nonce}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 200, "json": {"access_token": "x", "token_type": "DPoP"}}}
