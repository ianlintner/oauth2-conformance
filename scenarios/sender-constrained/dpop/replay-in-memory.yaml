id: sender-constrained.dpop.replay-in-memory
title: "An in-process cache rejects a repeated jti (local policy)"
requirements: ["RFC9449-11.1-replay-store-in-memory-floor"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-REPLAY-IN-MEMORY. Executable: dpop-proof with a captured byte-identical proof replayed in the same process; validated against Python and Rust conformance SUTs. Positive control: same client/token request accepted on first use."
steps:
  - {"id": "proof", "use": "dpop-proof", "with": {"htm": "POST", "htu": "http://localhost:8080/oauth/token"}, "expect": {"status": 200}, "capture": {"proof_token_ok": "body.proof"}}
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_token_ok}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 200, "json": {"access_token": "x", "token_type": "DPoP"}}}
  - {"id": "replay", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_token_ok}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 400, "json": {"error": "invalid_dpop_proof"}}}
