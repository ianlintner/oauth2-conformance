id: sender-constrained.dpop.htu-binding
title: "A proof whose htu differs from the request URI is rejected"
requirements: ["RFC9449-4.2-htu-binding"]
profile: sender-constrained
status: stable
note: "Invariant INV-SC-HTU-BINDING. Executable with the dpop-proof runner helper (no SUT interface change); Rust reference validated (see docs/sender-constrained-coverage.md). "
steps:
  - {"id": "proof", "use": "dpop-proof", "with": {"htm": "POST", "htu": "http://localhost:8080/oauth/other"}, "expect": {"status": 200}, "capture": {"proof_value": "body.proof"}}
  - {"id": "token", "request": {"method": "POST", "path": "/oauth/token", "headers": {"authorization": "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=", "dpop": "{{proof_value}}"}, "form": {"grant_type": "client_credentials"}}, "expect": {"status": 400, "json": {"error": "invalid_dpop_proof"}}}
