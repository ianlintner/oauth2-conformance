id: sender-constrained.abuse.invalid-client-rate-limited
title: "Repeated invalid_client failures are eventually answered 429 (local policy)"
requirements: ["RFC9700-2.5-invalid-client-rate-limited-policy"]
profile: sender-constrained
status: draft
note: "Invariant INV-SC-INVALID-CLIENT-RATE-LIMITED. Runner now supports step repetition ({ count: N }), so this drives a single client's invalid_client bucket with 100 failed auths. Draft, NOT coverage: RFC 9700 2.5 rate limiting is local policy (MAY), and neither SUT has been observed enforcing it. A `repeat` with a single per-iteration expect asserts status 429 every iteration; the correct shape is a loop that asserts 401 for the first N-1 attempts then 429 on the Nth — that dual/`until` assertion is the residual runner refinement, not yet implemented."
steps:
  - {"id": "bad", "repeat": {"count": 100}, "request": {"method": "POST", "path": "/oauth/token", "form": {"grant_type": "client_credentials"}, "headers": {"authorization": "Basic Y2xpZW50LWNjOndyb25n"}}, "expect": {"status": 429}}