id: core.token.invalid-client
title: Unknown client is rejected
requirements: [RFC6749-5.2-invalid-client]
profile: core
status: stable
steps:
  - id: token
    request:
      method: POST
      path: /oauth/token
      form: { grant_type: client_credentials, client_id: no-such-client, client_secret: wrong }
    expect:
      status: 401
      json: { error: invalid_client }
