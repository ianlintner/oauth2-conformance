id: core.token.authorization-code-invalid-client
title: Authorization-code exchange without client authentication is rejected
requirements: [RFC6749-4.1.3-invalid-client]
profile: hardening
status: draft
steps:
  - id: token
    request:
      method: POST
      path: /oauth/token
      form:
        grant_type: authorization_code
        code: 00000000-0000-0000-0000-000000000000
        redirect_uri: https://client.example/callback
    expect:
      status: 401
      headers: { www-authenticate: Basic }
      json: { error: invalid_client }
note: Ported from typescript-oauth2-server@d1999bf fixtures/rfc6749/invalid-client.json (status planned).
