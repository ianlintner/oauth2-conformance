id: core.token.error-no-store
title: Token error responses are not cacheable
requirements: [RFC6749-5.1-no-store]
profile: core
status: stable
note: |
  Conservative expectation: RFC 6749 5.1 states the no-store MUST for responses
  carrying tokens (success); the 5.2 error example shows the header but states no
  separate MUST. See docs/core-coverage.md (no-store attribution).

steps:
  - id: token
    request:
      method: POST
      path: /oauth/token
      form: { grant_type: urn:example:bogus }
    expect:
      status: 400
      headers: { cache-control: no-store }
