id: core.token.missing-grant-type
title: Missing grant_type is rejected
requirements: [RFC6749-5.2-missing-grant-type]
profile: core
status: stable
steps:
  - id: token
    request:
      method: POST
      path: /oauth/token
      form: { client_id: no-such-client }
    expect:
      status: 400
      json: { error: invalid_request }
