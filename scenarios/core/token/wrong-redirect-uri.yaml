id: core.token.wrong-redirect-uri
title: Token exchange with a mismatched redirect_uri is rejected
requirements: [RFC6749-4.1.3-wrong-redirect-uri]
profile: hardening
status: draft
steps:
  - id: token
    request:
      method: POST
      path: /oauth/token
      form:
        grant_type: authorization_code
        code: "{{code}}"
        client_id: client-a
        redirect_uri: https://attacker.example/callback
    expect:
      status: 400
      json: { error: invalid_grant }
note: |
  Requires live authorization setup and client registration to obtain a code
  with known redirect properties; no executable endpoint setup exists yet.
