id: core.token.basic-auth-wrong-secret
title: A client presenting a wrong secret over Basic is rejected 401 invalid_client
requirements: [RFC6749-5.2-invalid-client]
profile: core
status: stable
note: INV-BASIC-AUTH-FORM-ENCODED. Header = base64("client-cc:wrong-secret").
steps:
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWNjOndyb25nLXNlY3JldA==" }
      form: { grant_type: client_credentials }
    expect:
      status: 401
      json: { error: invalid_client }
