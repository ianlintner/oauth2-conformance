id: core.native.localhost-no-wildcard
title: The localhost hostname does not receive the loopback port wildcard
requirements: [RFC8252-7.3-localhost-no-wildcard]
profile: core
status: stable
note: |
  Local profile policy (conservative localhost strictness), not an RFC-imposed MUST.
  RFC 8252 section 7.3 requires the any-port exception only for loopback IP literals;
  section 8.3 says localhost is NOT RECOMMENDED and neither requires nor prohibits
  the exception for it. This profile keeps the http://localhost/cb registration exact,
  so a request for http://localhost:9999/cb is refused with invalid_request.
steps:
  - id: authorize
    request:
      method: GET
      path: /oauth/authorize
      query:
        response_type: code
        client_id: client-localhost
        redirect_uri: "http://localhost:9999/cb"
        state: s-localhost
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 400
      json: { error: invalid_request }
