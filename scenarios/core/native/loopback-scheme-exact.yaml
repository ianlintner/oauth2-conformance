id: core.native.loopback-scheme-exact
title: http and https loopback redirect URIs are distinct
requirements: [RFC8252-7.3-loopback-scheme-exact]
profile: core
status: stable
note: INV-LOOPBACK-PORT-WILDCARD. The registered http URI must not match an https request for the same host and path.
steps:
  - id: authorize
    request:
      method: GET
      path: /oauth/authorize
      query:
        response_type: code
        client_id: client-loopback-v4
        redirect_uri: "https://127.0.0.1:9999/cb"
        state: s-v4-scheme
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 400
      json: { error: invalid_request }
