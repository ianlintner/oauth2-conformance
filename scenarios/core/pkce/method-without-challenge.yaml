id: core.pkce.method-without-challenge
title: A code_challenge_method without a code_challenge is rejected
requirements: [RFC7636-4.2-method-without-challenge]
profile: core
status: reference-deviation
note: |
  INV-S256-ONLY. Rust answers 400 JSON invalid_request.
steps:
  - id: authorize
    request:
      method: GET
      path: /oauth/authorize
      query:
        response_type: code
        client_id: client-public
        redirect_uri: "https://client.example/callback"
        state: s-xyz
        code_challenge_method: S256
    expect:
      status: 302
      redirect:
        query: { error: invalid_request, state: s-xyz }
