id: core.pkce.verifier-short
title: A code_verifier shorter than 43 characters is rejected
requirements: [RFC7636-4.1-verifier-length]
profile: core
status: stable
note: |
  Invariant INV-VERIFIER-LENGTH. 42-character verifier.
  Runner gaps (part 3/3): with.loginPath is not declared by the SUT contract.
  login-and-authorize now continues past the login redirect (PR 3), but this
  scenario has not been re-verified against a seeded SUT and stays draft.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-public
        redirect_uri: https://client.example/callback
        state: s-gen
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: token
    request:
      method: POST
      path: /oauth/token
      form:
        grant_type: authorization_code
        code: "{{code}}"
        client_id: client-public
        redirect_uri: https://client.example/callback
        code_verifier: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
    expect:
      status: 400
