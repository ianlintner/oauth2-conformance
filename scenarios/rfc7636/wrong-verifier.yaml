id: rfc7636.pkce.wrong-verifier
title: PKCE code exchange with a mismatched verifier is rejected
requirements: [RFC7636-4.6-wrong-verifier]
profile: pkce
status: draft
steps:
  - id: token
    request:
      method: POST
      path: /oauth/token
      form:
        grant_type: authorization_code
        code: "{{code}}"
        client_id: client-a
        redirect_uri: https://client.example/callback
        code_verifier: wrong-verifier-does-not-match-challenge
    expect:
      status: 400
      json: { error: invalid_grant }
note: |
  Requires live authorization setup and client registration to obtain a code
  with known PKCE properties; no executable endpoint setup exists yet.
