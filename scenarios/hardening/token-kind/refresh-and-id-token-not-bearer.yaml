id: hardening.token-kind.refresh-and-id-token-not-bearer
title: "A refresh token and an ID token are refused as Bearer credentials at UserInfo"
requirements: [RFC8725-3.12-cross-jwt-confusion]
profile: hardening
profiles: [oidc-basic]
status: stable
note: "RFC 8725 section 3.12: \"If more than one kind of JWT can be issued by the same issuer, the validation rules for those JWTs MUST be written such that they are mutually exclusive, rejecting JWTs of the wrong kind.\" A refresh token and an ID token presented as a Bearer credential at UserInfo are refused 401 invalid_token, and an ID token presented at introspection is inactive. Passes Rust and Python."
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        state: s-cov1
        scope: openid read
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: exchange
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect:
      status: 200
      json: { access_token: "x" }
    capture:
      at: body.access_token
      rt: body.refresh_token
      idt: body.id_token
  - id: userinfo-refresh-token
    request:
      method: GET
      path: /oauth/userinfo
      headers: { authorization: "Bearer {{rt}}" }
    expect:
      status: 401
      json: { error: invalid_token }
  - id: userinfo-id-token
    request:
      method: GET
      path: /oauth/userinfo
      headers: { authorization: "Bearer {{idt}}" }
    expect:
      status: 401
      json: { error: invalid_token }
  - id: introspect-id-token
    request:
      method: POST
      path: /oauth/introspect
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form: { token: "{{idt}}" }
    expect:
      status: 200
      json: { active: false }
