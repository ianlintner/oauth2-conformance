id: resource.indicators.client-credentials-invalid-target-fragment
title: "client_credentials with a resource carrying a fragment is rejected 400 invalid_target"
requirements: [RFC8707-2-resource-invalid-target]
profile: resource
status: reference-deviation
note: "reference-deviation: passes Python, fails Rust (200). RFC 8707 section 2: the resource value \"MUST NOT include a fragment component\"; and \"If the authorization server fails to parse the provided value(s) or does not consider the resource(s) acceptable, it should reject the request with an error response using the error code invalid_target\"."
steps:
  - id: cc-resource
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=" }
      form:
        grant_type: client_credentials
        resource: "https://api-a.example/#frag"
    expect:
      status: 400
      json: { error: invalid_target }
