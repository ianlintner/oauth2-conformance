id: resource.indicators.client-credentials-invalid-target-unregistered
title: "client_credentials with a resource the client is not registered for is rejected 400 invalid_target"
requirements: [RFC8707-2-resource-invalid-target]
profile: resource
status: draft
note: "Draft: RFC 8707 section 2.2 leaves the acceptable resources to the authorization server's local policy, and the seed has no per-client resource registry, so there is no portable definition of an unregistered resource. Both Rust and Python accept the request (200). Needs a seed-level resource registry (SUT contract change) before it can be promoted."
steps:
  - id: cc-resource
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=" }
      form:
        grant_type: client_credentials
        resource: "https://unregistered.example/api"
    expect:
      status: 400
      json: { error: invalid_target }
