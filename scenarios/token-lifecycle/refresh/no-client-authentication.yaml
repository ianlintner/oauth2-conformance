id: token-lifecycle.refresh.no-client-authentication
title: "A refresh request with no client authentication is rejected 401 invalid_client"
requirements: ["RFC6749-6-refresh-client-authentication"]
profile: token-lifecycle
status: reference-deviation
note: "RFC 6749 section 6 requires a confidential client to authenticate. The reference SUT answers 200 and rotates the token without any client authentication (reference-deviation, a real SUT defect to be raised against it). The wrong-secret scenario keeps RFC6749-6-refresh-client-authentication covered as stable."
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        state: s-gen
        scope: read
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: exchange
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"grant_type":"authorization_code","code":"{{code}}","redirect_uri":"https://client.example/callback","code_verifier":"dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"}
    expect:
      status: 200
      json: {"access_token":"x","refresh_token":"x","token_type":"Bearer"}
    capture:
      at: body.access_token
      rt: body.refresh_token
  - id: no-auth
    request:
      method: POST
      path: /oauth/token
      form: {"grant_type":"refresh_token","refresh_token":"{{rt}}"}
    expect:
      status: 401
      json: {"error":"invalid_client"}
