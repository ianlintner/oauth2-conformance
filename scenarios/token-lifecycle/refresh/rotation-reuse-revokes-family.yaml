id: token-lifecycle.refresh.rotation-reuse-revokes-family
title: "Reusing a rotated refresh token is rejected and revokes the replacement too"
requirements: ["RFC9700-4.14.2-rotated-refresh-invalidated","RFC9700-4.14.2-rotated-reuse-revokes-family","RFC6749-6-refresh-old-token-may-be-revoked"]
profile: token-lifecycle
status: stable
note: "INV-REFRESH-ROTATION-REUSE."
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        state: s-gen
        scope: read
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: exchange
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"grant_type":"authorization_code","code":"{{code}}","redirect_uri":"https://client.example/callback","code_verifier":"dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"}
    expect:
      status: 200
      json: {"access_token":"x","refresh_token":"x","token_type":"Bearer"}
    capture:
      at: body.access_token
      rt: body.refresh_token
  - id: rotate
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"grant_type":"refresh_token","refresh_token":"{{rt}}"}
    expect:
      status: 200
      json: {"refresh_token":"x"}
    capture:
      rt2: body.refresh_token
  - id: reuse-old
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"grant_type":"refresh_token","refresh_token":"{{rt}}"}
    expect:
      status: 400
      json: {"error":"invalid_grant"}
  - id: family-dead
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"grant_type":"refresh_token","refresh_token":"{{rt2}}"}
    expect:
      status: 400
      json: {"error":"invalid_grant"}
