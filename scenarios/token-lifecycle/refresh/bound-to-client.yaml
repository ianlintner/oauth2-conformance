id: token-lifecycle.refresh.bound-to-client
title: "A refresh token presented by a different authenticated client is rejected 400"
requirements: ["RFC6749-10.4-refresh-bound-to-client"]
profile: token-lifecycle
status: stable
note: "INV-REFRESH-CLIENT-BINDING. client-cc is a valid client that does not own the token. Only the status is pinned: RFC 6749 section 5.2 names invalid_grant for a token issued to another client, but the reference SUT answers unauthorized_client, and the MUST under test is the rejection, not the code."
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        state: s-gen
        scope: read
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: exchange
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"grant_type":"authorization_code","code":"{{code}}","redirect_uri":"https://client.example/callback","code_verifier":"dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"}
    expect:
      status: 200
      json: {"access_token":"x","refresh_token":"x","token_type":"Bearer"}
    capture:
      at: body.access_token
      rt: body.refresh_token
  - id: foreign-client
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ="}
      form: {"grant_type":"refresh_token","refresh_token":"{{rt}}"}
    expect:
      status: 400
