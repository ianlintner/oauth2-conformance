id: token-lifecycle.client-credentials.wrong-secret
title: "A client_credentials request with a wrong secret is rejected 401 invalid_client"
requirements: ["RFC6749-4.4.2-cc-client-authenticates"]
profile: token-lifecycle
status: stable
steps:
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWNjOndyb25nLXNlY3JldA=="}
      form: {"grant_type":"client_credentials"}
    expect:
      status: 401
      json: {"error":"invalid_client"}
