id: token-lifecycle.revocation.wrong-secret
title: "Revocation with a wrong client secret is rejected 401 invalid_client and changes nothing"
requirements: ["RFC7009-2.1-client-authentication"]
profile: token-lifecycle
status: stable
note: "Extends the no-credentials scenario: the caller presents valid-looking credentials with the wrong secret (HTTP Basic and form). The token must stay active afterwards."
steps:
  - id: cc-token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=" }
      form: { grant_type: client_credentials }
    expect:
      status: 200
      json: { access_token: "x" }
    capture:
      at: body.access_token
  - id: wrong-basic
    request:
      method: POST
      path: /oauth/revoke
      headers: { authorization: "Basic Y2xpZW50LWNjOndyb25nLXNlY3JldA==" }
      form:
        token: "{{at}}"
    expect:
      status: 401
      json: { error: invalid_client }
  - id: wrong-form
    request:
      method: POST
      path: /oauth/revoke
      form:
        token: "{{at}}"
        client_id: client-cc
        client_secret: wrong-secret
    expect:
      status: 401
      json: { error: invalid_client }
  - id: still-active
    request:
      method: POST
      path: /oauth/introspect
      headers: { authorization: "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=" }
      form: { token: "{{at}}" }
    expect:
      status: 200
      json: { active: true }
