id: token-lifecycle.revocation.access-token
title: "Revoking an access token returns 200 and the token is immediately inactive and rejected at the resource"
requirements: ["RFC7009-2.2-success-200","RFC7009-2-access-revocation-supported","RFC7009-2.1-revocation-immediate","RFC7662-4-revoked-token-inactive"]
profile: token-lifecycle
status: stable
note: "INV-REVOKED-TOKEN-DEAD."
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        state: s-gen
        scope: openid
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: exchange
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"grant_type":"authorization_code","code":"{{code}}","redirect_uri":"https://client.example/callback","code_verifier":"dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"}
    expect:
      status: 200
      json: {"access_token":"x","refresh_token":"x","token_type":"Bearer"}
    capture:
      at: body.access_token
      rt: body.refresh_token
  - id: revoke
    request:
      method: POST
      path: /oauth/revoke
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"token":"{{at}}","token_type_hint":"access_token"}
    expect:
      status: 200
  - id: introspect
    request:
      method: POST
      path: /oauth/introspect
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"token":"{{at}}"}
    expect:
      status: 200
      json: {"active":false}
  - id: userinfo
    request:
      method: GET
      path: /oauth/userinfo
      headers: {"authorization":"Bearer {{at}}"}
    expect:
      status: 401
      headers: {"www-authenticate":"Bearer error=\"invalid_token\""}
