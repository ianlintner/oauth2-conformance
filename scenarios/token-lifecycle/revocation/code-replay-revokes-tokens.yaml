id: token-lifecycle.revocation.code-replay-revokes-tokens
title: "Replaying an authorization code makes the first exchange's access and refresh tokens unusable"
requirements: [RFC9700-2.1.1-code-replay-revokes-tokens]
profile: token-lifecycle
status: stable
note: |
  SHOULD-level (RFC 6749 section 4.1.2: "SHOULD revoke (when possible) all
  tokens previously issued based on that authorization code"; repeated in RFC
  9700 section 4.2.4). Passes Rust and Python. Exchange a code, replay it (invalid_grant),
  then the first exchange's access token must introspect inactive and its refresh
  token must be refused invalid_grant.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        state: s-cov1
        scope: read
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: exchange
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect:
      status: 200
      json: { access_token: "x" }
    capture:
      at: body.access_token
      rt: body.refresh_token
  - id: replay
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect:
      status: 400
      json: { error: invalid_grant }
  - id: access-token-inactive
    request:
      method: POST
      path: /oauth/introspect
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form: { token: "{{at}}" }
    expect:
      status: 200
      json: { active: false }
  - id: refresh-token-refused
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form: { grant_type: refresh_token, refresh_token: "{{rt}}" }
    expect:
      status: 400
      json: { error: invalid_grant }
