id: token-lifecycle.revocation.cross-client
title: "A client revoking another client's token is refused and the token stays active"
requirements: ["RFC7009-2.1-token-owned-by-client"]
profile: token-lifecycle
status: reference-deviation
note: "INV-REVOCATION-OWNER-ONLY. RFC 7009 section 2.1 requires the refusal but names no status; 400 is the conventional error. The reference SUT answers 200 and revokes the token (reference-deviation, to be raised against the SUT)."
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        state: s-gen
        scope: read
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: exchange
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"grant_type":"authorization_code","code":"{{code}}","redirect_uri":"https://client.example/callback","code_verifier":"dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"}
    expect:
      status: 200
      json: {"access_token":"x","refresh_token":"x","token_type":"Bearer"}
    capture:
      at: body.access_token
      rt: body.refresh_token
  - id: foreign-revoke
    request:
      method: POST
      path: /oauth/revoke
      headers: {"authorization":"Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ="}
      form: {"token":"{{at}}"}
    expect:
      status: 400
  - id: still-active
    request:
      method: POST
      path: /oauth/introspect
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"token":"{{at}}"}
    expect:
      status: 200
      json: {"active":true}
