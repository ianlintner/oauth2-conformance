id: token-lifecycle.introspection.caller-authentication
title: "Introspection without caller authentication is rejected 401 invalid_client"
requirements: ["RFC7662-2.1-caller-authentication","RFC7662-5-anonymous-introspection-strips-subject"]
profile: token-lifecycle
status: stable
note: "INV-INTROSPECT-CALLER-AUTH. The reference SUT refuses anonymous introspection, so no subject members can be disclosed (RFC7662-5)."
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        state: s-gen
        scope: read
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: exchange
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"grant_type":"authorization_code","code":"{{code}}","redirect_uri":"https://client.example/callback","code_verifier":"dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"}
    expect:
      status: 200
      json: {"access_token":"x","refresh_token":"x","token_type":"Bearer"}
    capture:
      at: body.access_token
      rt: body.refresh_token
  - id: anonymous
    request:
      method: POST
      path: /oauth/introspect
      form: {"token":"{{at}}"}
    expect:
      status: 401
      json: {"error":"invalid_client"}
