id: token-lifecycle.jwt.claims-match-metadata
title: "A JWT access token carries the required claims and an iss equal to the metadata issuer"
requirements: ["RFC9068-2.2-required-claims","RFC9068-4-iss-matches-metadata"]
profile: token-lifecycle
status: draft
note: "INV-JWT-ISS-MATCHES-METADATA. DRAFT: needs a runner capture that decodes a JWT payload (e.g. jwt.payload.iss); this draft approximates through the introspection response, which does not prove the token's own claims."
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        state: s-gen
        scope: read
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: exchange
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"grant_type":"authorization_code","code":"{{code}}","redirect_uri":"https://client.example/callback","code_verifier":"dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk"}
    expect:
      status: 200
      json: {"access_token":"x","refresh_token":"x","token_type":"Bearer"}
    capture:
      at: body.access_token
      rt: body.refresh_token
  - id: introspect
    request:
      method: POST
      path: /oauth/introspect
      headers: {"authorization":"Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA=="}
      form: {"token":"{{at}}"}
    expect:
      status: 200
      json: {"active":true,"iss":"http://localhost:8080","aud":"client-a","client_id":"client-a","jti":"x","exp":1,"iat":1}
