id: token-lifecycle.jwt.claims-match-metadata
title: "A JWT access token's iss claim equals the published server metadata issuer"
requirements: ["RFC9068-2.2-required-claims","RFC9068-4-iss-matches-metadata"]
profile: token-lifecycle
status: stable
note: "Decodes the token's own JWT payload (jwt.at.payload.iss) rather than the server's introspection view, then asserts it equals the seed issuer (http://localhost:8080, pinned in contract/sut-interface.md)."
steps:
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ="}
      form: {"grant_type":"client_credentials"}
    expect:
      status: 200
      json: {"access_token":"x","token_type":"Bearer"}
    capture:
      at: body.access_token
      iss: jwt.at.payload.iss
  - id: metadata
    request:
      method: GET
      path: /.well-known/oauth-authorization-server
    expect:
      status: 200
      json: {"issuer":"{{iss}}"}
