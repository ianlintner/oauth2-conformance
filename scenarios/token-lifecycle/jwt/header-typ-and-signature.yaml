id: token-lifecycle.jwt.header-typ-and-signature
title: "A JWT access token carries an at+jwt typ header and a non-none signing algorithm"
requirements: ["RFC9068-2.1-typ-header","RFC9068-2.1-jwt-signed","RFC9068-2.1-jwt-alg-none","RFC9068-2.1-rs256-supported"]
profile: token-lifecycle
status: reference-deviation
note: "The reference signs JWT access tokens with HS256 rather than RS256, so RFC9068-2.1-rs256-supported (MUST: include RS256) is not observed. RFC wins over the reference; this scenario stays a recorded reference-deviation. The typ header and non-none algorithm are decoded from the token's own JWT header (jwt.at.header.typ / jwt.at.header.alg) and asserted against response-observable metadata where possible; full assertion of the self-referential header requires a decode-inline expectation the runner does not yet expose."
steps:
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: {"authorization":"Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ="}
      form: {"grant_type":"client_credentials"}
    expect:
      status: 200
      json: {"access_token":"x","token_type":"Bearer"}
    capture:
      at: body.access_token
      typ: jwt.at.header.typ
      alg: jwt.at.header.alg
