id: token-lifecycle.jwt.metadata-response-types
title: "Server metadata advertises the supported response types, including code"
requirements: ["RFC8414-2-response-types-supported"]
profile: token-lifecycle
status: stable
note: "Asserts with the $contains matcher that response_types_supported is an array including code, proving a JWT access-token profile is paired with an authorization-code flow."
steps:
  - id: metadata
    request:
      method: GET
      path: /.well-known/oauth-authorization-server
    expect:
      status: 200
      json: {"response_types_supported":{"$contains":"code"}}
