id: token-lifecycle.client-auth.empty-secret-introspect-revoke
title: "An empty client_secret for a public client never authenticates at introspection or revocation"
requirements: [RFC6749-2.3.1-empty-secret-not-authentication-policy]
profile: token-lifecycle
status: draft
note: |
  Local hardening policy (no RFC keyword applies; see the requirement notes).
  client-public is seeded as a public client with no secret. A request that
  names it with an empty client_secret (form field present but empty) or an
  HTTP Basic header with an empty password must not be treated as
  confidential-client authentication, so introspection and revocation of a
  token are refused 401 invalid_client and the token stays active.
  Draft: passes Rust, fails Python (Python answers 200 at both endpoints), so
  per the architecture proposal it is reviewed before promotion. Only the HTTP
  Basic empty-password variant is expressed: the scenario schema requires form
  values to be at least one character, so the empty client_secret form-field
  variant needs a schema/runner change and is a residual of this batch.
steps:
  - id: cc-token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=" }
      form: { grant_type: client_credentials }
    expect:
      status: 200
      json: { access_token: "x" }
    capture:
      at: body.access_token
  - id: introspect-basic-empty
    request:
      method: POST
      path: /oauth/introspect
      headers: { authorization: "Basic Y2xpZW50LXB1YmxpYzo=" }
      form:
        token: "{{at}}"
    expect:
      status: 401
      json: { error: invalid_client }
  - id: revoke-basic-empty
    request:
      method: POST
      path: /oauth/revoke
      headers: { authorization: "Basic Y2xpZW50LXB1YmxpYzo=" }
      form:
        token: "{{at}}"
    expect:
      status: 401
      json: { error: invalid_client }
  - id: still-active
    request:
      method: POST
      path: /oauth/introspect
      headers: { authorization: "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=" }
      form: { token: "{{at}}" }
    expect:
      status: 200
      json: { active: true }
