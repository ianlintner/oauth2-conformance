id: token-lifecycle.client-auth.empty-secret-token-endpoint
title: "An empty client_secret for a public client never authenticates at the token endpoint"
requirements: [RFC6749-2.3.1-empty-secret-not-authentication-policy]
profile: token-lifecycle
status: stable
note: |
  Local hardening policy (see the requirement notes). A client_credentials
  request with HTTP Basic client-public and an empty password must
  not issue a token. The scenario expects 401 invalid_client; client-public has
  no client_credentials grant, so 400 unauthorized_client is also defensible but
  both Rust and Python answer 401 invalid_client and the runner cannot express
  alternatives. The empty client_secret form-field variant is not expressible
  (the scenario schema requires form values of at least one character).
steps:
  - id: cc-basic-empty
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LXB1YmxpYzo=" }
      form:
        grant_type: client_credentials
    expect:
      status: 401
      json: { error: invalid_client }
