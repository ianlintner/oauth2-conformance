id: oidc-basic.id-token.aud-iat-exp-nonce-claims
title: id_token carries aud, iat, exp and an echoed nonce
requirements:
  - OIDC-2-id-token-aud
  - OIDC-2-id-token-iat-exp
  - OIDC-3.1.2.1-nonce-echoed
profile: oidc-basic
status: draft
note: |
  Invariants INV-OIDC-AUD-CLIENT, INV-OIDC-IAT-EXP-ORDER, INV-OIDC-NONCE-ECHOED.
  The runner cannot yet assert these claims end-to-end with only existing
  features: `aud` may be a string or an array, and the jwt capture returns
  undefined for an array member; `iat`/`exp` are numeric and the runner has no
  numeric ordering matcher; and `nonce` echo needs a request-parameter-vs-claim
  comparison the runner does not express. Part 3/3 runner extensions must add
  aud membership, numeric iat<exp, and a captured-claim-vs-literal matcher.
  This scenario documents the intended assertions and stays non-executed.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        scope: openid
        state: s-claims
        nonce: n-0S6_WzA2Mj
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect:
      status: 200
      json: { id_token: "x" }
    capture:
      idt: body.id_token
      # Intent: assert aud contains client-a, iat and exp are numeric with
      # exp > iat, and nonce equals n-0S6_WzA2Mj. None of these are
      # expressible with current capture/matcher features; see note above.
