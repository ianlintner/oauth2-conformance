id: oidc-basic.id-token.scope-claims
title: id_token includes only claims authorized by the granted scopes
requirements: [OIDC-5.4-id-token-scope-claims]
profile: oidc-basic
status: draft
note: |
  Invariant INV-OIDC-ID-TOKEN-SCOPE-CLAIMS. OIDC Core 5.4 requires that claims
  about the end-user be authorized by the granted scopes before being placed in
  the id_token (or UserInfo). This is an exclusion assertion — prove requested
  profile/email claims are absent from an id_token whose authorization request
  did not grant those scopes — which the runner cannot express: there is no
  "claim keys equal exactly this set" matcher, and scope-to-claim authorization
  comparison needs claim-set introspection the runner lacks. Level SHOULD.
  Part 3/3 runner extensions (claim-set equality/absence assertions against a
  decoded id_token) are required.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        scope: openid
        state: s-scope-claims
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect:
      status: 200
      json: { id_token: "x" }
    capture:
      idt: body.id_token
      # Intent: assert no profile/email claims (name, email, etc.) when only
      # openid was requested. Not expressible with current matchers; see note.
