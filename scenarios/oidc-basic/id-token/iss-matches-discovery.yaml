id: oidc-basic.id-token.iss-matches-discovery
title: The id_token iss claim equals the published discovery issuer
requirements: [OIDC-2-id-token-compact-jwt, OIDC-2-id-token-iss]
profile: oidc-basic
status: stable
note: |
  Invariant INV-OIDC-ISS-MATCHES-DISCOVERY. A successful jwt.idt.payload.iss
  capture proves the id_token is a compact 3-segment JWT (decode throws
  otherwise); the follow-up discovery fetch asserts the decoded iss string
  equals the published issuer. No signature verification here — that is a
  JWKS-level concern outside oidc-basic.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        scope: openid
        state: s-iss
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect:
      status: 200
      json: { id_token: "x" }
    capture:
      idt: body.id_token
      iss: jwt.idt.payload.iss
  - id: discovery
    request:
      method: GET
      path: /.well-known/openid-configuration
    expect:
      status: 200
      json:
        issuer: "{{iss}}"
