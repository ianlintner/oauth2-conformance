id: oidc-basic.logout.frontchannel-logout-iframes
title: The logout page renders iframes only for registered, logged-in RPs
requirements: [FCL-2-iframe-with-iss-sid, FCL-2-registered-uri-only]
profile: oidc-basic
status: draft
note: |
  Needs examples/seed-logout.yaml. Only client-logout has a session;
  client-logout-idle has a registered frontchannel_logout_uri but must not
  appear (FCL section 3: RPs logged in to the user's OP session). The page
  is captured as text.body and parsed by the frontchannel-capture helper.
  Security-review addition (escaping of a registered URI containing quotes
  or angle brackets) needs a registration-time fixture and is residual work.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-logout
        redirect_uri: https://client.example/callback
        scope: openid
        state: s-logout
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWxvZ291dDp0ZXN0LW9ubHktbG9nb3V0LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect:
      status: 200
      json: { id_token: "x" }
    capture:
      idt: body.id_token
  - id: logout
    request:
      method: GET
      path: /oauth/logout
      query:
        id_token_hint: "{{idt}}"
    expect:
      status: 200
    capture:
      page: text.body
  - id: iframes
    use: frontchannel-capture
    with: { body: "{{page}}" }
    expect:
      status: 200
      json:
        iframe_srcs: { "$includes": "http://127.0.0.1:8099/frontchannel-logout" }
