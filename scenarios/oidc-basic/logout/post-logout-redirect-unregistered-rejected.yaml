id: oidc-basic.logout.post-logout-redirect-unregistered-rejected
title: An unregistered post_logout_redirect_uri is never redirected to
requirements: [RPINIT-2-post-logout-redirect-unregistered-rejected, RPINIT-2-post-logout-redirect-registered-exact]
profile: oidc-basic
status: draft
note: |
  Needs examples/seed-logout.yaml. A registered URI with an appended path is
  not an exact match. Expected: no redirect to the supplied URI. The Rust
  reference falls back to redirect_uris when post_logout_redirect_uris is
  empty (not the case for client-logout, which registers one), so this case
  is expected to pass there once seeded; the redirect_uris fallback itself is
  a separate reference-deviation candidate.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-logout
        redirect_uri: https://client.example/callback
        scope: openid
        state: s-logout
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWxvZ291dDp0ZXN0LW9ubHktbG9nb3V0LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect:
      status: 200
      json: { id_token: "x" }
    capture:
      idt: body.id_token
  - id: logout
    request:
      method: GET
      path: /oauth/logout
      query:
        id_token_hint: "{{idt}}"
        post_logout_redirect_uri: https://client.example/logged-out/extra
        state: s-bad
    expect:
      # RP-Initiated Logout 1.0 §2 forbids the redirect; an HTML error page or
      # any other non-redirect response is conformant.
      statusNot: [301, 302, 303, 307, 308]
      redirectNot:
        location: https://client.example/logged-out/extra
