id: oidc-basic.logout.post-logout-redirect-state-echo
title: A registered post_logout_redirect_uri is honoured exactly and state is echoed
requirements: [RPINIT-2-post-logout-redirect-registered-exact, RPINIT-2-state-echoed-on-redirect]
profile: oidc-basic
status: draft
note: |
  Needs the logout seed (examples/seed-logout.yaml): client-logout registers
  post_logout_redirect_uris. Draft until a port's seed loader accepts the
  logout registration fields (the pinned Rust seed has deny_unknown_fields
  and no logout fields). The SUT logout endpoint path is /oauth/logout.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-logout
        redirect_uri: https://client.example/callback
        scope: openid
        state: s-logout
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWxvZ291dDp0ZXN0LW9ubHktbG9nb3V0LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect:
      status: 200
      json: { id_token: "x" }
    capture:
      idt: body.id_token
  - id: logout
    request:
      method: GET
      path: /oauth/logout
      query:
        id_token_hint: "{{idt}}"
        post_logout_redirect_uri: https://client.example/logged-out
        state: s-post-logout
    expect:
      status: 302
      redirect:
        locationPrefix: https://client.example/logged-out
        query: { state: s-post-logout }
