id: oidc-basic.prompt.prompt-login-reauthenticates
title: prompt=login forces re-authentication even with an active session
requirements: [OIDC-3.1.2.1-prompt-login-reauthenticates]
profile: oidc-basic
status: draft
note: |
  Invariant INV-OIDC-PROMPT-LOGIN-REAUTHENTICATES. prompt=login must force a
  fresh authentication even when a session is already active; proving this
  needs a run that first establishes a session, then re-issues authorize with
  prompt=login and observes a bound auth_time change or a fresh login redirect.
  Level SHOULD in OIDC Core; oidc-basic tracks it as profile strictness.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      session: create
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        scope: openid
        state: s-prompt-login
        prompt: login
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
