id: oidc-basic.prompt.max-age-and-auth-time
title: max_age=0 forces re-authentication and the id_token carries auth_time
requirements:
  - OIDC-3.1.2.1-max-age-reauthenticates
  - OIDC-3.1.2.1-auth-time-claim
profile: oidc-basic
status: draft
note: |
  Invariants INV-OIDC-MAX-AGE-REAUTHENTICATES, INV-OIDC-AUTH-TIME-CLAIM.
  max_age=0 requires treating any existing session without a fresh auth_time
  as stale and forcing a new authentication, after which the id_token must
  carry an auth_time claim. The token/assert steps exercise the claim ordering
  with $ltCapture, but neither reference SUT currently carries the session's
  auth_time through code redemption into the id_token, so the claim capture
  is unbound and the scenario stays draft until the SUTs are fixed.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      session: create
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        scope: openid
        state: s-max-age
        max_age: "0"
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
      redirect:
        locationPrefix: https://client.example/callback?
        query:
          state: s-max-age
    capture:
      code: redirect.query.code
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect:
      status: 200
      json: { id_token: "x" }
    capture:
      idt: body.id_token
      auth_time: jwt.idt.payload.auth_time
      exp: jwt.idt.payload.exp
  - id: assert-auth-time
    source: jwt.idt.payload
    assert:
      json:
        auth_time: { "$ltCapture": [auth_time, exp] }
