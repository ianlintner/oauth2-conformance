id: oidc-basic.userinfo.rejects-client-credentials-token
title: UserInfo rejects an access token issued with the client_credentials grant
requirements: [OIDC-5.3-userinfo-rejects-client-credentials-token]
profile: oidc-basic
status: draft
note: |
  Invariant INV-OIDC-USERINFO-REJECTS-CC-TOKEN. A UserInfo request carrying an
  access token issued under the client_credentials grant represents an
  application, not an end-user, and should be rejected (invalid_token) rather
  than returning a fabricated sub. The reference SUT returns unauthorized when a
  token has no user_id (wellknown::userinfo). This is expression-level MAY and
  stable with current features, but is left draft because the SUT's
  client_credentials userinfo handling is not yet claimed in
  reference/conformance.yaml and client-cc in the seed grants no openid scope;
  it should be promoted to stable after part 3/3 confirms the SUT contract.
steps:
  - id: cc-token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=" }
      form:
        grant_type: client_credentials
    expect:
      status: 200
      json: { access_token: "x" }
    capture:
      cc: body.access_token
  - id: userinfo
    request:
      method: GET
      path: /oauth/userinfo
      headers: { authorization: "Bearer {{cc}}" }
    expect:
      status: 401
      json:
        error: invalid_token
