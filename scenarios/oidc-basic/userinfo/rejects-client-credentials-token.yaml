id: oidc-basic.userinfo.rejects-client-credentials-token
title: UserInfo rejects an access token issued with the client_credentials grant
requirements: [OIDC-5.3-userinfo-rejects-client-credentials-token]
profile: oidc-basic
status: stable
note: |
  Invariant INV-OIDC-USERINFO-REJECTS-CC-TOKEN. A UserInfo request carrying an
  access token issued under the client_credentials grant represents an
  application, not an end-user, and is rejected (invalid_token) rather than
  returning a fabricated sub. Both reference SUTs return unauthorized when a
  token has no subject; the seed's client-cc carries no openid scope. OIDC Core
  5.3 rates this as MAY; oidc-basic asserts the reference behavior.
steps:
  - id: cc-token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWNjOnRlc3Qtb25seS1jYy1zZWNyZXQ=" }
      form:
        grant_type: client_credentials
    expect:
      status: 200
      json: { access_token: "x" }
    capture:
      cc: body.access_token
  - id: userinfo
    request:
      method: GET
      path: /oauth/userinfo
      headers: { authorization: "Bearer {{cc}}" }
    expect:
      status: 401
      json:
        error: invalid_token
