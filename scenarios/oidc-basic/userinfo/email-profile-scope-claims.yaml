id: oidc-basic.userinfo.email-profile-scope-claims
title: UserInfo includes email and profile claims only for the granted scopes
requirements:
  - OIDC-5.4-userinfo-email-scope
  - OIDC-5.4-userinfo-profile-scope
profile: oidc-basic
status: stable
note: |
  Invariants INV-OIDC-USERINFO-EMAIL-SCOPE, INV-OIDC-USERINFO-PROFILE-SCOPE.
  email and preferred_username are scope-gated in the reference SUTs and
  appear only when a real user record exists in storage. The conformance seed
  now pins alice's email and grants client-a the email/profile scopes, so both
  reference SUTs return deterministic values. OIDC Core 5.4 rates these
  claims as SHOULD; oidc-basic tracks the scope gate as profile strictness.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        scope: openid email profile
        state: s-scope
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
      redirect:
        locationPrefix: https://client.example/callback?
        query:
          state: s-scope
    capture:
      code: redirect.query.code
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect:
      status: 200
      json: { id_token: "x", access_token: "x" }
    capture:
      idt: body.id_token
      sub: jwt.idt.payload.sub
      at: body.access_token
  - id: userinfo
    request:
      method: GET
      path: /oauth/userinfo
      headers: { authorization: "Bearer {{at}}" }
    expect:
      status: 200
      json:
        sub: "{{sub}}"
        email: alice@conformance.invalid
        preferred_username: alice
