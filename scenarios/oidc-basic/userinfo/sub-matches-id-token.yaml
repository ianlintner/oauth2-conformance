id: oidc-basic.userinfo.sub-matches-id-token
title: UserInfo sub equals the id_token subject
requirements: [OIDC-2-id-token-sub, OIDC-5.3-userinfo-sub]
profile: oidc-basic
status: stable
note: |
  Invariants INV-OIDC-SUB-PRESENT, INV-OIDC-USERINFO-SUB-MATCHES. The id_token
  sub is captured on exchange; the UserInfo response sub must equal it, proving
  both that the id_token carries a non-empty subject and that the UserInfo
  endpoint reports the same end-user.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        scope: openid
        state: s-sub
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect:
      status: 302
    capture:
      code: redirect.query.code
  - id: token
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect:
      status: 200
      json: { id_token: "x", access_token: "x" }
    capture:
      idt: body.id_token
      sub: jwt.idt.payload.sub
      at: body.access_token
  - id: userinfo
    request:
      method: GET
      path: /oauth/userinfo
      headers: { authorization: "Bearer {{at}}" }
    expect:
      status: 200
      json:
        sub: "{{sub}}"
