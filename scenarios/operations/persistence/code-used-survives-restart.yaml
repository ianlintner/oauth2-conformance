id: operations.persistence.code-used-survives-restart
title: "A code consumed before a restart is still single-use afterwards"
requirements: [OPS-5.1-code-used-survives-restart]
profile: operations
status: draft
note: |
  Invariant INV-OPS-PERSIST-CODE-RESTART (OPS-5.1 MUST; RFC 6749 4.1.2).
  Draft: contract section 7.4 requires state to survive the restart of the
  same process on the same base URL. The Rust reference at origin/main
  fail-closes conformance mode unless OAUTH2_DATABASE_URL=sqlite::memory:, so
  no consumed code survives a restart. Not promoted: a 400 after restart would
  only prove the code was never persisted. Harness:
  examples/sut-config.multi-instance.yaml; see reference/persistence-harness.md.
steps:
  - id: auth
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        state: s-persist-restart
        scope: read
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect: { status: 302 }
    capture: { code: redirect.query.code }
  - id: exchange-before-restart
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect: { status: 200, json: { token_type: Bearer, access_token: x } }
    capture: { at: body.access_token }
  - id: restart
    use: sut-restart
    expect: { status: 200, json: { restarted: true } }
  - id: persisted-state-control
    request:
      method: POST
      path: /oauth/introspect
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form: { token: "{{at}}" }
    expect: { status: 200, json: { active: true } }
  - id: replay-after-restart
    request:
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect: { status: 400, json: { error: invalid_grant } }
