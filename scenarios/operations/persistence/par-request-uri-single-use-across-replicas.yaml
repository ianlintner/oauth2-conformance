id: operations.persistence.par-request-uri-single-use-across-replicas
title: "A PAR request_uri consumed on one instance is rejected on another"
requirements: [OPS-5.5-par-request-uri-single-use-across-replicas]
profile: operations
status: draft
note: |
  Invariant INV-OPS-PERSIST-PAR-REPLICAS (OPS-5.5 SHOULD; RFC 9126 2.2).
  Draft: contract section 7.5 requires one shared durable store; the Rust
  reference at origin/main fail-closes conformance mode unless
  OAUTH2_DATABASE_URL=sqlite::memory:. The first use is a complete
  authorization on instance a (so the second use is asserted against a
  consumed request_uri, not an unknown one); the second use goes to instance b
  with the same request_uri and no session, as in the stable single-instance
  PAR scenario, where the server checks the request_uri before binding a
  session. Not promoted: isolated in-memory stores cannot share the consumed
  record. Harness: examples/sut-config.multi-instance.yaml; see
  reference/persistence-harness.md.
steps:
  - id: push
    use: request-on-instance
    with:
      instance: a
      method: POST
      path: /oauth/par
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        client_id: client-a
        response_type: code
        redirect_uri: https://client.example/callback
        scope: read
        state: s-persist-par
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect: { status: 201, jsonSchema: { type: object, required: [request_uri, expires_in] } }
    capture: { ru: body.request_uri }
  - id: login-warmup
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      session: create
      query:
        response_type: code
        client_id: client-a
        redirect_uri: https://client.example/callback
        state: s-persist-login
        scope: read
        code_challenge: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM
        code_challenge_method: S256
    expect: { status: 302 }
  - id: first-use-on-a
    use: login-and-authorize
    with:
      username: alice
      password: test-only-password
      loginPath: /auth/login
      authorizePath: /oauth/authorize
      session: reuse
      query:
        response_type: code
        client_id: client-a
        request_uri: "{{ru}}"
    expect: { status: 302 }
    capture: { code: redirect.query.code }
  - id: shared-store-control-on-b
    use: request-on-instance
    with:
      instance: b
      method: POST
      path: /oauth/token
      headers: { authorization: "Basic Y2xpZW50LWE6dGVzdC1vbmx5LXNlY3JldA==" }
      form:
        grant_type: authorization_code
        code: "{{code}}"
        redirect_uri: https://client.example/callback
        code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
    expect: { status: 200, json: { token_type: Bearer, access_token: x } }
  - id: second-use-on-b
    use: request-on-instance
    with:
      instance: b
      method: GET
      path: /oauth/authorize
      query:
        response_type: code
        client_id: client-a
        request_uri: "{{ru}}"
    expect: { status: 400 }
