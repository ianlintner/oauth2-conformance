id: operations.social-login.post-login-redirect-validated
title: A successful social-login callback must not follow an unsafe post-login redirect
requirements: [OPS-4.4-post-login-redirect-validated]
profile: operations
status: draft
note: |
  Invariant INV-OPS-SOCIAL-POST-LOGIN-REDIRECT-VALIDATED. Draft: the runner now
  supplies a real synthetic code through `mock-idp-authorize` (contract 7.10),
  so no external IdP is contacted. The remaining blocker is that no documented
  black-box capability seeds an unsafe `return_to` target; `{{unsafe_return_to}}`
  is deliberately unbound so this scenario fails closed rather than passing
  vacuously with a safe default. Needs a SUT advertising
  `provider-base-url-configurable` plus a documented way to install the unsafe
  target before it can become stable. Do not promote by weakening a clause.
steps:
  - id: login-google
    request:
      method: GET
      path: /auth/login/google
      query: { return_to: '{{unsafe_return_to}}' }
    expect: { status: 302 }
    capture:
      state: redirect.query.state
      session: cookie.first
      location: header.location
  - id: mock-idp-authorize
    use: mock-idp-authorize
    with: { location: '{{location}}' }
    expect: { status: 302 }
    capture:
      code: redirect.query.code
      idp_state: redirect.query.state
  - id: callback-success
    request:
      method: GET
      path: /auth/callback/google
      query: { code: '{{code}}', state: '{{state}}' }
      headers: { cookie: '{{session}}' }
    expect:
      status: 302
      statusNot: [400, 403, 500]
      redirectNot: { location: 'https://attacker.example/' }
