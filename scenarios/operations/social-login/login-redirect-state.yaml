id: operations.social-login.login-redirect-state
title: Login initiation redirects to the provider with a session-bound state
requirements: [OPS-4.2-login-redirect-state]
profile: operations
status: stable
note: |
  Invariant INV-OPS-SOCIAL-LOGIN-STATE. Harness precondition (`reference/social-login-harness.md`): `google` is configured with placeholder credentials. The 302
  is observed, not followed (the runner never follows redirects), so no
  identity provider is contacted. The provider host is deliberately not
  asserted: provider base URLs are a SHOULD (OPS-4.1-provider-base-url-configurable)
  that the Rust reference does not yet implement. The step asserts that the
  Location carries a nonempty `state` and that the response sets the session
  cookie in which the server records the expected state. The callback
  scenarios in this directory constrain that binding by replaying that cookie;
  none shows a successful code exchange, so the binding is implied rather than
  positively proven (see `post-login-redirect-validated`, a draft).
steps:
  - id: login-google
    request:
      method: GET
      path: /auth/login/google
    expect:
      status: 302
      headers:
        location: { $regex: '[?&]state=[^&]+' }
        set-cookie: { $nonempty: true }
    capture:
      state: redirect.query.state
      session: cookie.first
  - id: state-nonempty
    assert:
      json:
        state: { $nonempty: true }
