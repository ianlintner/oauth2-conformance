id: operations.runtime.ready-503-when-storage-unhealthy
title: Readiness answers 503 while the SUT storage health check is failing
requirements: [OPS-3.2-ready-503-when-storage-unhealthy]
profile: operations
status: draft
note: |
  Invariant INV-OPS-READY-503-STORAGE-UNHEALTHY. Draft: requires a SUT that
  advertises `storage-fault` and implements POST /conformance/storage-fault
  (contract 7.9). The fault is injected in the SUT, and `/ready` must observe
  it: the runner never fabricates readiness. No Capability/seed field exists
  yet, so this scenario defers on SUTs without the capability. The fault is
  disabled in the last step so later scenarios see a healthy store.
steps:
  - id: fault-on
    use: storage-fault
    with: { enabled: true }
    expect: { status: 200, json: { enabled: true } }
  - id: ready-failing
    request:
      method: GET
      path: /ready
      headers: { accept: application/json }
    expect: { status: 503 }
  - id: fault-off
    use: storage-fault
    with: { enabled: false }
    expect: { status: 200, json: { enabled: false } }
  - id: ready-restored
    request:
      method: GET
      path: /ready
      headers: { accept: application/json }
    expect:
      status: 200
      json:
        status: ready
        checks: { database: ok }
