id: operations.runtime.metrics-request-counter-status-class
title: The status-class request counter increases when a request completes
requirements: [OPS-3.3-metrics-request-counter-status-class]
profile: operations
status: stable
note: |
  Invariant INV-OPS-METRICS-STATUS-CLASS-COUNTER. Read the 2xx series before
  and after a liveness request; the raw text is captured from /metrics and the
  prometheus-sample helper selects the configured status-class sample. §3.3
  defines the counter behaviour but not the family or label names, so those
  come from the harness `--sut-config metrics` map: this check stays portable
  across ports. Growth is evidence that at least one 2xx request occurred in
  the interval; it cannot attribute the increment to the probe alone because
  the two /metrics scrapes are themselves 2xx requests.
steps:
  - id: scrape-before
    request: { method: GET, path: /metrics }
    expect: { status: 200 }
    capture: { before_text: text.body }
  - id: read-before
    use: prometheus-sample
    with:
      body: '{{before_text}}'
      metric: '{{metrics.requestsByStatusClass}}'
      labels: { '{{metrics.statusClassLabel}}': '{{metrics.successStatusClass}}' }
    capture: { before: body.value }
  - id: probe
    request: { method: GET, path: /health }
    expect: { status: 200 }
  - id: scrape-after
    request: { method: GET, path: /metrics }
    expect: { status: 200 }
    capture: { after_text: text.body }
  - id: read-after
    use: prometheus-sample
    with:
      body: '{{after_text}}'
      metric: '{{metrics.requestsByStatusClass}}'
      labels: { '{{metrics.statusClassLabel}}': '{{metrics.successStatusClass}}' }
    capture: { after: body.value }
  - id: grew
    assert:
      json: { after: { "$gtCapture": [after, before] } }
