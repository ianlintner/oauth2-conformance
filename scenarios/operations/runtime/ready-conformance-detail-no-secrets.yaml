id: operations.runtime.ready-conformance-detail-no-secrets
title: The readiness conformance object carries identifiers and counts only
requirements: [OPS-3.2-ready-conformance-detail-no-secrets]
profile: operations
status: stable
note: |
  Invariant INV-OPS-CONFORMANCE-DETAIL-NO-SECRETS. MUST NOT: the inline schema
  closes the conformance object to exactly the documented fields and requires
  signing_key_ids to be short identifiers, not key material. `additionalProperties:
  false` is deliberately stricter than the prose "counts and identifiers only":
  a harmless extra identifier would fail this check. That is intentional for a
  MUST NOT assertion that has to fail closed on leaked material.
steps:
  - id: ready
    request:
      method: GET
      path: /ready
      headers: { accept: application/json }
    expect:
      status: 200
      jsonSchema:
        type: object
        required: [conformance]
        properties:
          conformance:
            type: object
            required: [seed_applied, clients, users, signing_key_ids]
            additionalProperties: false
            properties:
              seed_applied: { type: boolean }
              clients: { type: integer, minimum: 0 }
              users: { type: integer, minimum: 0 }
              signing_key_ids:
                type: array
                items:
                  type: string
                  pattern: '^[A-Za-z0-9._:-]+$'
                  maxLength: 128
