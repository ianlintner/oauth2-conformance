# Deviations: none. The six token-lifecycle scenarios and the device access-denied
# scenario the contract records as `reference-deviation` (RFC wins over the Rust
# reference) are RFC-correct in this port, so there is nothing to declare. Two
# owner-gated requirements remain deferred in the contract for all ports and are
# known gaps, not deviations: RFC7662-4-expiry-checked and
# RFC9700-2.2.2-public-refresh-rotated-or-bound.
