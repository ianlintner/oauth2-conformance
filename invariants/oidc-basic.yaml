# Cross-scenario invariants for the oidc-basic profile (contract v0.3).
#
# Same conventions as invariants/core.yaml and invariants/token-lifecycle.yaml:
# one requirement per invariant, ids cited from scenario notes. Machine wiring
# into cross-run and trace checks arrives with the runner extensions in part 3/3.

- id: INV-OIDC-ID-TOKEN-ON-OPENID-SCOPE
  profile: oidc-basic
  summary: A code exchange whose authorization request included openid yields an id_token member.
  requirement: OIDC-3.1.3.1-id-token-on-openid-scope

- id: INV-OIDC-NO-ID-TOKEN-WITHOUT-OPENID-SCOPE
  profile: oidc-basic
  summary: A token response omits id_token whenever the authorization request did not include the openid scope.
  requirement: OIDC-3.1.3.1-no-id-token-without-openid-scope

- id: INV-OIDC-ID-TOKEN-COMPACT-JWT
  profile: oidc-basic
  summary: The id_token is a compact three-segment JWS-JWT that decodes into a header and payload.
  requirement: OIDC-2-id-token-compact-jwt

- id: INV-OIDC-SUB-PRESENT
  profile: oidc-basic
  summary: Every id_token carries a non-empty sub identifying the end-user.
  requirement: OIDC-2-id-token-sub

- id: INV-OIDC-ISS-MATCHES-DISCOVERY
  profile: oidc-basic
  summary: The id_token iss is a case-sensitive exact match for the published discovery issuer.
  requirement: OIDC-2-id-token-iss

- id: INV-OIDC-AUD-CLIENT
  profile: oidc-basic
  summary: The id_token aud contains the client_id of the OAuth client that requested it.
  requirement: OIDC-2-id-token-aud

- id: INV-OIDC-IAT-EXP-ORDER
  profile: oidc-basic
  summary: The id_token iat and exp are NumericDate values with exp strictly after iat.
  requirement: OIDC-2-id-token-iat-exp

- id: INV-OIDC-NONCE-ECHOED
  profile: oidc-basic
  summary: When the authorization request sent a nonce, the id_token nonce echoes that exact value.
  requirement: OIDC-3.1.2.1-nonce-echoed

- id: INV-OIDC-PROMPT-NONE-LOGIN-REQUIRED
  profile: oidc-basic
  summary: prompt=none with no active session fails with login_required instead of prompting.
  requirement: OIDC-3.1.2.1-prompt-none-login-required

- id: INV-OIDC-PROMPT-LOGIN-REAUTHENTICATES
  profile: oidc-basic
  summary: prompt=login forces a fresh authentication even when a session is active.
  requirement: OIDC-3.1.2.1-prompt-login-reauthenticates

- id: INV-OIDC-MAX-AGE-REAUTHENTICATES
  profile: oidc-basic
  summary: max_age with a stale session forces re-authentication before issuing the id_token.
  requirement: OIDC-3.1.2.1-max-age-reauthenticates

- id: INV-OIDC-AUTH-TIME-CLAIM
  profile: oidc-basic
  summary: The id_token carries an auth_time claim when a max_age request was processed.
  requirement: OIDC-3.1.2.1-auth-time-claim

- id: INV-OIDC-USERINFO-SUB-MATCHES
  profile: oidc-basic
  summary: The UserInfo sub equals the subject of the id_token.
  requirement: OIDC-5.3-userinfo-sub

- id: INV-OIDC-USERINFO-MISSING-TOKEN-401
  profile: oidc-basic
  summary: UserInfo returns 401 with a Bearer challenge when no access token is presented.
  requirement: OIDC-5.3-userinfo-missing-token-401

- id: INV-OIDC-USERINFO-EMAIL-SCOPE
  profile: oidc-basic
  summary: UserInfo discloses the email claim only when the email scope was granted.
  requirement: OIDC-5.4-userinfo-email-scope

- id: INV-OIDC-USERINFO-PROFILE-SCOPE
  profile: oidc-basic
  summary: UserInfo discloses profile claims only when the profile scope was granted.
  requirement: OIDC-5.4-userinfo-profile-scope

- id: INV-OIDC-ID-TOKEN-SCOPE-CLAIMS
  profile: oidc-basic
  summary: The id_token carries only end-user claims authorized by the granted scopes.
  requirement: OIDC-5.4-id-token-scope-claims

- id: INV-OIDC-USERINFO-REJECTS-CC-TOKEN
  profile: oidc-basic
  summary: UserInfo rejects an access token issued under the client_credentials grant.
  requirement: OIDC-5.3-userinfo-rejects-client-credentials-token

- id: INV-OIDC-RPINIT-HINT-AUD-REGISTERED
  profile: oidc-basic
  summary: RP-initiated logout rejects an id_token_hint whose aud matches no registered client.
  requirement: RPINIT-2-logout-id-token-hint-aud
