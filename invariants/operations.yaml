# Cross-scenario invariants for the operations profile (§3 runtime endpoints, §4 social login).
#
# Same conventions as invariants/oidc-basic.yaml: one requirement per
# invariant, ids cited from scenario notes. Machine wiring into cross-run and
# trace checks arrives with the runner extensions in part 3/3.

- id: INV-OPS-HEALTH-UNAUTHENTICATED
  profile: operations
  summary: /health answers 200 with a service status body and needs no credentials.
  requirement: OPS-3.1-health-200-no-auth

- id: INV-OPS-READY-DB-CHECK
  profile: operations
  summary: /ready reports status ready and checks.database ok when storage is healthy.
  requirement: OPS-3.2-ready-200-database-ok

- id: INV-OPS-READY-503-ON-STORAGE-FAILURE
  profile: operations
  summary: /ready answers 503 when the storage health check fails.
  requirement: OPS-3.2-ready-503-when-storage-unhealthy
  note: Needs the C-06 ticket 4 storage-fault capability; scenario stays draft until then.

- id: INV-OPS-CONFORMANCE-READY-DETAIL
  profile: operations
  summary: Conformance-mode /ready reports seed state and signing key identifiers.
  requirement: OPS-3.2-ready-conformance-detail

- id: INV-OPS-CONFORMANCE-DETAIL-NO-SECRETS
  profile: operations
  summary: The /ready conformance object carries counts and identifiers only, never credentials or key material.
  requirement: OPS-3.2-ready-conformance-detail-no-secrets

- id: INV-OPS-METRICS-PROMETHEUS-TEXT
  profile: operations
  summary: /metrics emits Prometheus text exposition with HELP/TYPE annotations and parseable samples.
  requirement: OPS-3.3-metrics-prometheus-text-format

- id: INV-OPS-METRICS-STATUS-CLASS-COUNTER
  profile: operations
  summary: A status-class-labelled request counter increases when a request completes.
  requirement: OPS-3.3-metrics-request-counter-status-class

- id: INV-OPS-METRICS-DURATION-HISTOGRAM
  profile: operations
  summary: A request duration histogram observes every request, including an +Inf bucket and a growing sample count.
  requirement: OPS-3.3-metrics-duration-histogram

- id: INV-OPS-METRICS-FAILED-AUTH-COUNTER
  profile: operations
  summary: A rejected client authentication increases the dedicated failed-authentication counter.
  requirement: OPS-3.3-metrics-failed-authentications-counter

- id: INV-OPS-EVENTS-HEALTH-REPORTS-AVAILABILITY
  profile: operations
  summary: /events/health reports whether event ingest is enabled and which plugins are healthy.
  requirement: OPS-3.4-event-ingest-health-endpoint

# §4 social login. Harness precondition for all of these: `reference/social-login-harness.md`
# (google configured with placeholder credentials, github known but
# unconfigured). No identity provider is contacted except by the draft
# post-login scenario, which needs the C-06 ticket 4 mock identity provider.

- id: INV-OPS-SOCIAL-PROVIDER-NOT-CONFIGURED
  profile: operations
  summary: Login for a known provider with no configured credentials answers 400 provider_not_configured.
  requirement: OPS-4.1-provider-not-configured

- id: INV-OPS-SOCIAL-LOGIN-STATE
  profile: operations
  summary: Login initiation sets a session and 302s to the provider with a nonempty state query parameter.
  requirement: OPS-4.2-login-redirect-state

- id: INV-OPS-SOCIAL-CALLBACK-STATE-REQUIRED
  profile: operations
  summary: A callback carrying the login session but no state answers 403 access_denied.
  requirement: OPS-4.2-callback-state-missing-access-denied

- id: INV-OPS-SOCIAL-CALLBACK-STATE-BOUND
  profile: operations
  summary: A callback carrying the login session and a state other than the issued one answers 403 access_denied.
  requirement: OPS-4.2-callback-state-mismatch-access-denied

- id: INV-OPS-SOCIAL-CALLBACK-PROVIDER-BOUND
  profile: operations
  summary: A callback with the issued state but a different supported provider in the path answers 400 invalid_request.
  requirement: OPS-4.3-callback-provider-mismatch-invalid-request

- id: INV-OPS-SOCIAL-CALLBACK-UNSUPPORTED-PROVIDER
  profile: operations
  summary: A callback with the issued state for a provider the server does not implement answers 400 invalid_request.
  requirement: OPS-4.3-callback-unsupported-provider-invalid-request

- id: INV-OPS-SOCIAL-POST-LOGIN-REDIRECT-SAFE
  profile: operations
  summary: After a successful callback an unsafe post-login target is replaced by a default destination, never followed.
  requirement: OPS-4.4-post-login-redirect-validated
  note: Needs the C-06 ticket 4 mock identity provider; scenario stays draft until then.

# §5 persistence. All nine scenarios need contract section 7.4 (restart) or
# section 7.5 (instances sharing one durable store). The Rust reference at
# origin/main fail-closes conformance mode unless the store is process-local
# in-memory SQLite, so none can be promoted without a reference fix (R-06).
# Each draft includes a positive control (a token/proof accepted on the second
# instance, or state still introspectable after restart) so isolated stores
# cannot pass by returning "unknown token" to a negative-only assertion.
# Harness: examples/sut-config.multi-instance.yaml and
# reference/persistence-harness.md.

- id: INV-OPS-PERSIST-CODE-REPLICAS
  profile: operations
  summary: A consumed authorization code cannot be redeemed on another instance sharing the store.
  requirement: OPS-5.1-code-single-use-across-replicas

- id: INV-OPS-PERSIST-CODE-RESTART
  profile: operations
  summary: A consumed authorization code is still rejected after the SUT restarts on the same base URL.
  requirement: OPS-5.1-code-used-survives-restart

- id: INV-OPS-PERSIST-REFRESH-ROTATION
  profile: operations
  summary: A refresh token rotated on one instance is accepted on another while its predecessor is rejected.
  requirement: OPS-5.2-refresh-rotation-across-replicas

- id: INV-OPS-PERSIST-REFRESH-FAMILY
  profile: operations
  summary: Reusing a rotated refresh token on one instance revokes the whole family on another.
  requirement: OPS-5.2-refresh-reuse-revokes-family-across-replicas

- id: INV-OPS-PERSIST-REVOCATION
  profile: operations
  summary: Revocation on one instance is visible to introspection, resource and refresh flows on another.
  requirement: OPS-5.3-revocation-across-replicas

- id: INV-OPS-PERSIST-DPOP-REPLAY-REPLICAS
  profile: operations
  summary: A DPoP proof consumed on one instance is rejected on another with the same key and jti.
  requirement: OPS-5.4-dpop-replay-across-replicas

- id: INV-OPS-PERSIST-DPOP-REPLAY-RESTART
  profile: operations
  summary: A consumed DPoP proof is still rejected after the SUT restarts on the same base URL.
  requirement: OPS-5.4-dpop-replay-survives-restart

- id: INV-OPS-PERSIST-PAR-REPLICAS
  profile: operations
  summary: A PAR request_uri consumed on one instance is rejected on another.
  requirement: OPS-5.5-par-request-uri-single-use-across-replicas

- id: INV-OPS-PERSIST-DEVICE-REPLICAS
  profile: operations
  summary: An approved device code redeemed on one instance cannot be redeemed on another.
  requirement: OPS-5.5-device-code-single-use-across-replicas
