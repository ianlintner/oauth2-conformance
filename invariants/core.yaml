# Cross-scenario invariants for the core profile.

# Each invariant is stated once, against a single requirement id, and named so
# scenarios and generated traces can cite it. Part 3/3 (runner extensions and
# reference validation) wires these ids into the runner's cross-run and trace
# checks; until then they are declarative and the scenarios in
# scenarios/core/ carry an `invariants:` field naming what each step observes.

# Code issuance and single-use.
- id: INV-CODE-SINGLE-USE
  profile: core
  summary: An authorization code is redeemed at most once; a second exchange of the same code is rejected and never issues a second token set.
  requirement: RFC6749-4.1.3-code-single-use

- id: INV-CODE-CLIENT-BINDING
  profile: core
  summary: An authorization code is bound to the client it was issued to; exchanging it with different client authentication is rejected.
  requirement: RFC6749-4.1.3-invalid-client

- id: INV-CODE-REDIRECT-BINDING
  profile: core
  summary: The redirect_uri presented at code exchange must equal the one used at authorization; a mismatch is rejected.
  requirement: RFC6749-4.1.3-redirect-uri-mismatch

- id: INV-CODE-ENTROPY
  profile: core
  summary: Authorization codes are unguessable and carry enough entropy that guessing a valid code is computationally infeasible within their validity window.
  requirement: RFC6749-10.5-code-single-use

# Client authentication.
- id: INV-CLIENT-SINGLE-AUTH-METHOD
  profile: core
  summary: A token request authenticates a confidential client with exactly one method; supplying credentials through more than one channel is rejected.
  requirement: RFC6749-2.3-client-credentials-single-method

- id: INV-BASIC-AUTH-FORM-ENCODED
  profile: core
  summary: client_id and client_secret are form-urlencoded before being placed in an HTTP Basic authorization header.
  requirement: RFC6749-2.3.1-basic-auth-urlencoded

# PKCE.
- id: INV-S256-ONLY
  profile: core
  summary: For authorization_code clients the only accepted code_challenge_method is S256; the plain method is rejected.
  requirement: RFC7636-4.2-plain-rejected

- id: INV-PKCE-BINDING
  profile: core
  summary: A code issued with a registered challenge only exchanges for the verifier whose S256 digest equals that challenge.
  requirement: RFC7636-4.6-s256-verify

- id: INV-VERIFIER-LENGTH
  profile: core
  summary: A code_verifier whose length is outside 43..128 characters is rejected.
  requirement: RFC7636-4.1-verifier-length

# iss (RFC 9207).
- id: INV-ISS-ON-AUTHORIZE-RESPONSE
  profile: core
  summary: Every authorization response delivered by redirect - success or error - carries an iss parameter whose decoded value is the issuer identifier.
  requirement: RFC9207-2-iss-on-success

- id: INV-ISS-MATCHES-METADATA
  profile: core
  summary: When the server publishes authorization-server metadata, the decoded iss value equals the issuer field in that metadata.
  requirement: RFC9207-2.3-iss-matches-metadata-issuer

# Redirect URI discipline (RFC 8252 native clients).
- id: INV-LOOPBACK-PORT-WILDCARD
  profile: core
  summary: A registered loopback literal redirect URI (127.0.0.1 or [::1]) matches requests carrying any port, while path and scheme stay exact.
  requirement: RFC8252-7.3-loopback-ipv4-any-port

- id: INV-LOOPBACK-FAMILIES-DISTINCT
  profile: core
  summary: IPv4 and IPv6 loopback registrations are distinct and do not cross-match; localhost registrations stay exact-match as local profile policy (RFC 8252 section 8.3).
  requirement: RFC8252-7.3-loopback-families-distinct

- id: INV-REDIRECT-EXACT-MATCH
  profile: core
  summary: A non-loopback redirect URI, including a claimed private-use scheme, requires a byte-for-byte exact match with no normalization or port wildcarding.
  requirement: RFC8252-7.1-private-uri-scheme-exact

# HTTPS / grant policy (RFC 9700).
- id: INV-NO-HTTP-REDIRECT-URI
  profile: core
  summary: The authorization server does not deliver authorization responses to an http redirect URI unless that URI is an RFC 8252 loopback redirect.
  requirement: RFC9700-2.6-no-http-redirect-uri

- id: INV-NO-IMPLICIT
  profile: core
  summary: The implicit grant is not issued; a request for it is rejected or otherwise declined, never returning tokens in the redirect.
  requirement: RFC9700-2.1.2-implicit-grant-rejected-policy

- id: INV-NO-ROPC
  profile: core
  summary: The resource-owner password credentials grant is not supported and its grant_type is rejected.
  requirement: RFC9700-2.4-ropc-prohibited

# Token response hygiene.
- id: INV-TOKEN-RESPONSE-NOT-CACHEABLE
  profile: core
  summary: Token endpoint responses carrying tokens or credentials include Cache-Control no-store and Pragma no-cache.
  requirement: RFC6749-5.1-no-store

- id: INV-ERROR-RESPONSE-SHAPE
  profile: core
  summary: A token endpoint error is a JSON object carrying an error field, delivered over the HTTP status the RFC specifies (often 400; 401 for failed client authentication).
  requirement: RFC6749-5.2-error-format
