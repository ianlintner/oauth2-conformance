id: hardening
title: Authorization-code hardening
description: Authorization-code exchange checks from RFC 6749 and RFC 9700 that need a seeded client and a live authorization code. Draft only until the runner supports that setup.
requirements:
  - RFC6749-4.1.3-invalid-client
  - RFC6749-4.1.3-wrong-redirect-uri
  - RFC9700-4.5-code-replay
  - RFC8725-3.1-alg-allow-list
  - RFC8725-3.1-alg-none-rejected-everywhere
  - RFC8725-3.1-key-algorithm-confusion
  - RFC8725-3.2-no-weak-algorithms
  - RFC8725-3.5-hs-secret-entropy
  - RFC8725-3.8-issuer-subject-validated
  - RFC8725-3.9-audience-validated
  - RFC8725-3.11-explicit-typ
  - RFC8725-3.12-cross-jwt-confusion
  - RFC8725-3.3-signature-before-claims
  - RFC8725-2.6-header-key-injection
  - RFC7517-4.5-kid-unique-across-rotation
  - RFC7517-4.5-new-tokens-use-new-kid
  - RFC7517-5-old-key-published-during-grace
  - RFC7517-5-old-key-retired-after-grace
  - RFC7517-5-jwks-no-private-material
  - RFC7517-4.5-token-header-kid-present
  - RFC7517-5-jwks-cache-headers
  - RFC9207-3-metadata-iss-parameter-supported
  - RFC9700-4.4.2-iss-on-every-response-mode
  - RFC9700-4.4.2-no-iss-from-request
  - RFC9700-4.4.2-issuer-matches-metadata-and-tokens
  - RFC9700-4.4.2.2-per-client-redirect-exact
  - RFC9700-4.4-metadata-endpoints-same-origin-policy
