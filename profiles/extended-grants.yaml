id: extended-grants
title: Extended grants and request/registration extensions
description: v0.4 extended-grants profile. RFC 8628 device grant, RFC 9126 PAR, RFC 7591/7592 dynamic client registration, RFC 9101 JAR, RFC 9396 RAR, RFC 8693 token exchange and RFC 7523 client assertions (contract v0.4, requirements only).
