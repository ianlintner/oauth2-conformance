id: sender-constrained
title: Sender-constrained tokens and abuse controls
description: v0.5 sender-constrained profile. RFC 9449 DPoP (proof validation, ath, nonce, jti replay), RFC 8705 mTLS certificate-bound tokens, and RFC 9700 rate limiting and sender-constraint controls (contract v0.5, requirements only).
