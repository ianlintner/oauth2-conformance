id: admin-api
title: Admin API (optional JSON admin surface)
description: "Optional admin JSON surface for the v0.6 operations contract. RBAC, the fail-closed bearer allow-list, revocation on disable/delete/password-change, secret-returned-once, CSRF protection for session-authenticated mutations, session-cookie attributes, and the no-secret-exposure rule are MUST. The HTML console redirect and product-specific shapes (audit action names, capabilities and dashboard keys) are SHOULD. Clauses are defined by docs/operations-profile.md section 2."
