id: operations
title: Operations - admin API, health and metrics, social login, persistence
description: "v0.6 operations profile. Admin API with RBAC, paging and denylist, health/ready/metrics, audit events, social login against a mock IdP, and single-use/replay guarantees across replicas and restarts (contract v0.6, requirements only). Clauses are defined by docs/operations-profile.md, not by an RFC; persistence clauses restate RFC requirements as deployment conditions. Strictness: the profile lists every catalogued level (MUST, MUST NOT, SHOULD, MAY); only MUST and MUST NOT entries gate a pass."
