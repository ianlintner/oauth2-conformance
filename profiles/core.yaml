id: core
title: Core authorization-code server
description: v0.1 core profile. RFC 6749 authorization code and client authentication, RFC 7636 PKCE (S256 only), RFC 9207 iss, RFC 8252 native redirects, RFC 9700 code replay / state / redirect / HTTPS rules, and no implicit/ROPC (implicit rejection is a local policy pending owner approval).
