id: oidc-basic
title: OpenID Connect basic relying-party support
description: v0.3 oidc profile. OpenID Connect Core 1.0 ID token issuance and claims, nonce, prompt/max_age request parameters, the UserInfo endpoint behind a bearer token, scope-derived claims, OIDC Discovery provider metadata, and RP-initiated logout hint validation (contract v0.3, requirements only).
