  - FAPI2-5.3.2.1-confidential-clients-only
  - FAPI2-5.3.2.1-client-auth-methods
  - FAPI2-5.3.2.1-issuer-string-only
  - FAPI2-5.3.2.1-no-refresh-rotation-default
  - FAPI2-5.3.2.1-future-iat-window-10s
  - FAPI2-5.3.2.2-par-required
  - FAPI2-5.3.2.2-par-redirect-uri-required
  - FAPI2-5.3.2.2-par-request-uri-expiry-600
  - FAPI2-5.3.2.2-pkce-s256-only
  - FAPI2-5.3.2.2-no-http-307
  - FAPI2-5.3.2.2-oidc-nonce-64
  - FAPI2-5.3.2.1-dpop-code-binding
  - FAPI2-5.4.1-signing-algs-ps256-es256-eddsa
