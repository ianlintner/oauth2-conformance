id: fapi2
title: "FAPI 2.0 Security Profile (optional)"
description: "Contract v0.7 optional, requirements-only profile. Server-side FAPI 2.0 Security Profile delta plus reuse of existing PAR, PKCE, DPoP, mTLS, iss and RAR requirements. See docs/standards-map.md. No stable scenarios yet. Strictness: only MUST and MUST NOT entries gate a pass."
