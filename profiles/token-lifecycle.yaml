id: token-lifecycle
title: Token lifecycle
description: Client credentials, refresh token rotation and family revocation, RFC 6750 bearer usage, RFC 7009 revocation, RFC 7662 introspection, RFC 8414 metadata, RFC 9068 JWT access tokens, JWKS and key rotation, and opaque tokens (contract v0.2).
