id: resource
title: "Resource-server surface: indicators, metadata, JWT introspection, step-up"
description: "Contract v0.7 requirements-only profile. RFC 8707 resource indicators, RFC 9728 protected resource metadata, RFC 9701 JWT introspection responses and RFC 9470 step-up authentication. No stable scenarios yet. Strictness: the profile lists every catalogued level; only MUST and MUST NOT entries gate a pass."
requirements:
  - RFC8707-2-resource-param-authz
  - RFC8707-2-resource-invalid-target
  - RFC8707-2.2-token-request-resource
  - RFC8707-2.2-resource-subset-of-authorized
